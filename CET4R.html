<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四级正确率监测</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF6B9D'/%3E%3Crect x='13' y='35' width='9' height='16' rx='3' fill='%23fff' opacity='.75'/%3E%3Crect x='27.5' y='25' width='9' height='26' rx='3' fill='%23fff' opacity='.88'/%3E%3Crect x='42' y='13' width='9' height='38' rx='3' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   1. Token
   ============================================================ */
:root{
  --font:'Noto Sans SC',system-ui,-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  --num:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r-xs:6px; --r-sm:8px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-card:18px; --r-pill:999px;
  --dur:.2s; --ease:cubic-bezier(.32,.72,0,1);
  /* 主题切换交叉淡入用单独一条对称缓动：--ease 是"前快"型，会让整页明暗变成一次快闪 */
  --vt-dur:.46s; --vt-ease:cubic-bezier(.42,0,.58,1);
  /* 入场动效：统一时长与缓动，全站只此一套 */
  --en:.52s; --en-ease:cubic-bezier(.22,1,.36,1);
  --side:340px; --gap:16px; --pad-x:28px; --tabw:104px;
}
html[data-theme="light"]{
  --bg:#FFF7FA; --bg-2:#FFFFFF;
  --surface:#FFFFFF; --surface-2:#FFF7FA; --surface-3:#FFF1F6; --surface-4:#FFFBFD;
  --ink:#3D2430; --ink-2:#7A6570; --ink-3:#9A8492; --ink-4:#C2AFB9; --ink-5:#DCCDD5;
  --line:#FFE3ED; --line-2:#FFF1F6; --line-3:#FFDCE9; --line-4:#FFC9DC;
  --rose:#FF6B9D; --rose-soft:#E04B84; --rose-dim:rgba(255,107,157,.12); --rose-line:rgba(255,107,157,.34);
  --pink-1:#FFDCE9; --pink-2:#FFA5C0;
  --ok:#34C99A; --ok-bg:#EAF9F3; --ok-fg:#2FA37C;
  --amber:#F5A623; --danger:#F2647C; --vocab:#C77DFF; --vocab-bg:#F6EDFF;
  --track:#FFF1F6; --shadow:0 1px 2px rgba(61,36,48,.04);
  color-scheme:light;
  --shadow-h:0 8px 24px rgba(224,75,132,.10), 0 2px 6px rgba(61,36,48,.04);
  --ghost:rgba(61,36,48,.045); --ghost-2:rgba(61,36,48,.075);
  --seg-thumb:#FFFFFF;
  --bg-a:#FFB3CD; --bg-b:#E3C4FF; --bg-c:#B6EEDF;
  --bg-a-o:.40; --bg-b-o:.30; --bg-c-o:.30;
  --grid-dot:rgba(61,36,48,.055);
  --scrim:rgba(61,36,48,.28);
}
html[data-theme="dark"]{
  --bg:#08080A; --bg-2:#0D0D11;
  --surface:#141419; --surface-2:#1A1A20; --surface-3:#212128; --surface-4:#17171C;
  --ink:#F2EEF1; --ink-2:#C9C2C8; --ink-3:#9B939B; --ink-4:#6E666E; --ink-5:#4A444B;
  --line:#26262E; --line-2:#202027; --line-3:#32323B; --line-4:#3E3E48;
  --rose:#FF6B9D; --rose-soft:#FF8AB7; --rose-dim:rgba(255,107,157,.14); --rose-line:rgba(255,107,157,.38);
  --pink-1:#3A2430; --pink-2:#C97C9C;
  --ok:#3FD1A2; --ok-bg:#122B22; --ok-fg:#4FDCAC;
  --amber:#F0A93C; --danger:#FF7385; --vocab:#B98CFF; --vocab-bg:#221A33;
  --track:#202027; --shadow:0 1px 2px rgba(0,0,0,.5);
  color-scheme:dark;
  --shadow-h:0 10px 28px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.4);
  --ghost:rgba(242,238,241,.05); --ghost-2:rgba(242,238,241,.09);
  --seg-thumb:#2E2E37;
  --bg-a:#7A3355; --bg-b:#4A2F73; --bg-c:#14493F;
  --bg-a-o:.22; --bg-b-o:.16; --bg-c-o:.14;
  --grid-dot:rgba(242,238,241,.035);
  --scrim:rgba(0,0,0,.66);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font); font-size:13px; line-height:1.5;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
a{color:inherit}
b,strong{font-weight:600}
.num,.tnum{font-family:var(--num);font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
/* 输入框不自画焦点框：外层 :focus-within 已是唯一一圈描边，否则出现两道框 */
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0;display:none}
::selection{background:var(--rose-dim);color:var(--rose-soft)}

/* ============================================================
   2. 背景装饰
   ------------------------------------------------------------
   一层**静态**极淡点阵 + 三团缓慢漂浮的柔光斑。
   三条自律（就是为了"不要太乱"）：
     · 不跟鼠标 —— 任何"跟着光标跑的光"都会变成探照灯；
     · 位移幅度小（±3%）、周期长（30s+）、透明度低，静止看几乎察觉不到在动；
     · 全部挂在 transform 上（合成层），不触发布局。
   ============================================================ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{
  position:absolute;display:block;border-radius:50%;filter:blur(80px);
  will-change:transform;animation:drift 34s var(--ease) infinite alternate;
}
.bg i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-14vh;background:var(--bg-a);opacity:var(--bg-a-o);animation-duration:34s}
.bg i:nth-child(2){width:40vw;height:40vw;right:-6vw;top:6vh;background:var(--bg-b);opacity:var(--bg-b-o);animation-duration:42s;animation-delay:-8s}
.bg i:nth-child(3){width:52vw;height:52vw;left:22vw;bottom:-28vh;background:var(--bg-c);opacity:var(--bg-c-o);animation-duration:38s;animation-delay:-16s}
@keyframes drift{
  from{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(2.6vw,-2.2vh,0) scale(1.06)}
  to{transform:translate3d(-2.2vw,2.4vh,0) scale(.97)}
}
/* 点阵：纯静态，低对比，做"纸面质感"用 */
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:radial-gradient(var(--grid-dot) 1px, transparent 1px);
  background-size:22px 22px;
  background-position:center center;
  mask-image:radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 30%, #000 30%, transparent 100%);
}
/* 主题切换：交叉淡入，两帧 opacity 之和恒为 1，中间不闪第三种底色 */
html.vt-theme::view-transition-old(root){animation:vt-out var(--vt-dur) var(--vt-ease) both}
html.vt-theme::view-transition-new(root){animation:vt-in var(--vt-dur) var(--vt-ease) both}
@keyframes vt-out{from{opacity:1}to{opacity:0}}
@keyframes vt-in{from{opacity:0}to{opacity:1}}
/* 降级路径：过渡结束再重绘（新节点没有旧值可过渡，提前重绘会跳色） */
html.theme-anim,html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color var(--vt-dur) var(--vt-ease),color var(--vt-dur) var(--vt-ease),
    border-color var(--vt-dur) var(--vt-ease),box-shadow var(--vt-dur) var(--vt-ease),
    fill var(--vt-dur) var(--vt-ease),stroke var(--vt-dur) var(--vt-ease) !important;
}

/* ============================================================
   3. 顶栏
   ============================================================ */
.nav{
  position:sticky;top:0;z-index:60;
  height:64px;display:flex;align-items:center;gap:22px;
  padding:0 var(--pad-x);
  background:color-mix(in srgb, var(--bg-2) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(12px);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
/* logo = 一整块纯色（不加任何图形/描边/透明度） */
.mark{width:26px;height:26px;border-radius:var(--r-sm);background:var(--rose);flex:none}
.bname{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.cdt{
  display:inline-flex;align-items:center;padding:4px 8px;border-radius:var(--r-xs);
  background:var(--surface-3);color:var(--rose-soft);font-size:10px;white-space:nowrap;
}
.tabs{position:relative;display:flex;align-items:center;gap:2px;flex:1;justify-content:center;min-width:0}
/* 滑块：位置由 JS 按 .on 按钮矩形摆放，切换时靠 transition 滑过去 */
.tab-thumb{
  position:absolute;top:0;left:0;height:34px;border-radius:var(--r-sm);
  background:var(--rose-dim);z-index:0;
  transition:transform var(--dur) var(--ease),width var(--dur) var(--ease);
  will-change:transform,width;
}
.tab-thumb[hidden]{display:none}
.tab{
  position:relative;z-index:1;
  height:34px;width:var(--tabw);padding:0 10px;border-radius:var(--r-sm);
  font-size:13px;color:var(--ink-3);
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
  transition:color var(--dur) var(--ease);
}
.tab:hover{color:var(--ink-2)}
.tab.on{color:var(--rose-soft)}
.navact{display:flex;align-items:center;gap:8px;flex:none}
.ibtn{
  height:34px;padding:0 12px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line-3);color:var(--ink-2);font-size:13px;
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.ibtn:hover{background:var(--ghost);border-color:var(--line-4)}
.ibtn:active{transform:scale(.97)}
.ibtn svg{width:14px;height:14px;flex:none}
.ibtn.icon{padding:0;width:34px;justify-content:center}
.pbtn{
  height:34px;padding:0 16px 0 13px;border-radius:var(--r-sm);background:var(--rose);color:#fff;
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;
  transition:filter var(--dur),transform var(--dur),box-shadow var(--dur);
}
.pbtn:hover{filter:brightness(1.07);box-shadow:0 4px 14px var(--rose-line)}
.pbtn:active{transform:scale(.97)}
.pbtn svg{width:14px;height:14px;flex:none}

/* ============================================================
   4. 骨架
   ============================================================ */
.shell{
  position:relative;z-index:1;
  display:grid;grid-template-columns:minmax(0,1fr) var(--side);
  gap:var(--gap);align-items:start;
  max-width:1480px;margin:0 auto;padding:22px var(--pad-x) 56px;
}
.main{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:86px}
@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:-1}
}

/* ============================================================
   5. 卡片与通用件
   ============================================================ */
.card{
  position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:18px 20px;min-width:0;
  transition:box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.card.hoverable:hover{box-shadow:var(--shadow-h);border-color:var(--line-4);transform:translateY(-1px)}
html[data-theme="dark"] .card{box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 2px 6px rgba(0,0,0,.3)}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.chead .hl{display:flex;align-items:center;gap:8px;min-width:0}
.chead h3{font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.chead .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.chead .meta{font-size:11px;color:var(--ink-4);text-align:right;flex:none}
.pill{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  padding:3px 8px;border-radius:var(--r-xs);background:var(--surface-3);
  font-size:10px;color:var(--ink-3);white-space:nowrap;transition:background var(--dur),color var(--dur);
}
.pill.rose{background:var(--rose-dim);color:var(--rose-soft)}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{background:var(--surface-3);color:var(--amber)}
.pill.vocab{background:var(--vocab-bg);color:var(--vocab)}
.dot{width:8px;height:8px;border-radius:3px;flex:none;transition:background var(--dur)}
.dot.rd{border-radius:50%}
.row{display:flex;gap:var(--gap);align-items:stretch;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
/* 双列布局：左右两列各自纵向堆叠 —— 并排单卡时高度差会夹出大段空白，
   列式堆叠把空隙赶到列尾，版面立刻干净 */
.cols{display:grid;grid-template-columns:minmax(0,1fr) var(--rc,400px);gap:var(--gap);align-items:start;min-width:0}
.cols.lfix{grid-template-columns:var(--lc,480px) minmax(0,1fr);align-items:stretch}
.cols .col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (max-width:1180px){
  .cols,.cols.lfix{grid-template-columns:minmax(0,1fr)}
}
.grid{display:grid;gap:var(--gap);min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:12px 0}
.empty{
  padding:34px 16px;text-align:center;color:var(--ink-4);font-size:12px;
  border:1px dashed var(--line-3);border-radius:var(--r-lg);background:var(--surface-2);
}
.foot{font-size:10px;color:var(--ink-4);line-height:1.7}

/* 按钮 */
.btn{
  height:36px;padding:0 14px;border-radius:var(--r-md);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--line-3);color:var(--ink-2);font-size:12px;font-weight:500;
  transition:background var(--dur),border-color var(--dur),transform var(--dur),filter var(--dur);
}
.btn:hover{background:var(--ghost);border-color:var(--line-4)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--rose);border-color:var(--rose);color:#fff;font-weight:600}
.btn.p:hover{filter:brightness(1.07);background:var(--rose);box-shadow:0 4px 14px var(--rose-line)}
.btn.g{background:var(--surface-3);border-color:var(--line-4);color:var(--rose-soft);font-weight:600}
.btn.d{border-color:var(--rose-line);color:var(--danger)}
.btn.d:hover{background:var(--rose-dim)}
.btn.sm{height:30px;padding:0 10px;font-size:11px;border-radius:var(--r-sm)}
.btn.blk{width:100%}
.btn svg{width:14px;height:14px;flex:none}

/* 分段器：一根长条 + 一枚滑块，点击时滑块滑过去（不是每块独立按钮） */
.seg{position:relative;display:inline-flex;padding:4px;background:var(--surface-3);border-radius:11px;isolation:isolate}
.seg button{
  position:relative;z-index:1;height:32px;padding:0 14px;border-radius:8px;
  font-size:12px;color:var(--ink-3);white-space:nowrap;
  transition:color var(--dur) var(--ease);
}
.seg button:hover{color:var(--ink-2)}
.seg button.on{color:var(--rose-soft)}
.seg-thumb{
  position:absolute;top:4px;bottom:4px;left:0;border-radius:8px;background:var(--seg-thumb);
  box-shadow:0 1px 3px rgba(61,36,48,.10);z-index:0;
  transition:transform var(--dur) var(--ease),width var(--dur) var(--ease);
  will-change:transform,width;
}
html[data-theme="dark"] .seg-thumb{box-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.sm{padding:3px;border-radius:9px}
.seg.sm button{height:26px;padding:0 10px;font-size:11px;border-radius:7px}
.seg.sm .seg-thumb{top:3px;bottom:3px;border-radius:7px}
.seg.fw{display:flex;width:100%}
.seg.fw button{flex:1;padding:0 6px}

/* 表单 */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:10px;color:var(--ink-3)}
.inp{
  height:36px;padding:0 10px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line-3);
  font-size:13px;color:var(--ink);width:100%;
  transition:border-color var(--dur),background var(--dur),box-shadow var(--dur);
}
.inp:hover{border-color:var(--line-4)}
.inp::placeholder{color:var(--ink-4)}
.field:focus-within .inp{border-color:var(--rose);background:var(--surface);box-shadow:0 0 0 3px var(--rose-dim)}
textarea.inp{height:auto;min-height:60px;padding:8px 10px;resize:vertical;line-height:1.6}
.inp.num{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:center;height:44px;font-size:17px;font-weight:600}
/* 侧栏空间只有 340px，表单控件整体收一号 —— 大输入框是给主区表单用的 */
.side .inp{height:32px;font-size:12px;padding:0 9px;border-radius:8px}
.side .inp.num{height:34px;font-size:13px;font-weight:600}
.side textarea.inp{min-height:46px;padding:7px 9px;font-size:12px}
.side .chip{height:25px;padding:0 10px;font-size:10.5px}
.side .btn.blk{height:38px}
.side .field > label{font-size:9.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  height:28px;padding:0 12px;border-radius:var(--r-pill);display:inline-flex;align-items:center;
  background:var(--surface-2);border:1px solid var(--line-3);color:var(--ink-2);font-size:11px;font-weight:500;
  transition:background var(--dur),border-color var(--dur),color var(--dur),transform var(--dur);
}
.chip:hover{border-color:var(--rose-line);color:var(--rose-soft)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff}
.chip.on:hover{color:#fff}
.chip .cd{width:7px;height:7px;border-radius:50%;margin-right:6px;background:currentColor;opacity:.75}
.chip.on .cd{background:#fff;opacity:.9}
/* 智能推荐行：模块 chips 上方的一条可点推荐 */
.reco-row{
  width:100%;display:flex;align-items:center;gap:8px;margin-bottom:10px;
  padding:9px 11px;border-radius:10px;text-align:left;
  background:var(--rose-dim);border:1px solid var(--rose-line);
  transition:background var(--dur),border-color var(--dur),transform var(--dur);
}
.reco-row:hover{background:var(--rose-line);transform:translateY(-1px)}
.reco-row:active{transform:scale(.985)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line-2)}
.tbl th{font-size:10px;color:var(--ink-4);font-weight:400;white-space:nowrap}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr{transition:background var(--dur)}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tr.grp td{background:var(--surface-3);font-weight:600;font-size:11px;color:var(--rose-soft);border-bottom-color:transparent}
.tbl tr.grp:hover td{background:var(--surface-3)}
.tbl tr.sum td{background:var(--surface-3);font-weight:600}
.tbl .ops{display:inline-flex;gap:10px}
.tbl .ops button{font-size:11px;color:var(--rose-soft);font-weight:500;transition:opacity var(--dur)}
.tbl .ops button:hover{opacity:.7}
.tbl .ops button.del{color:var(--danger)}

/* 环形进度 */
.ring{flex:none;display:block}
.ring .arc{transition:stroke-dasharray .7s var(--en-ease)}

/* 条形 */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;flex-direction:column;gap:4px;padding:9px 12px;border-radius:var(--r-lg);background:var(--surface-2);transition:background var(--dur),box-shadow var(--dur)}
.bar-row.hi{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-4)}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar-name{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;width:66px;flex:none;min-width:0}
.bar-line{display:flex;align-items:center;gap:10px}
.bar-track{position:relative;flex:1;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar-track.thin{height:8px;border-radius:4px}
.bar-fill{
  position:absolute;left:0;top:0;bottom:0;border-radius:inherit;
  width:0;transition:width .85s var(--ease),background .5s var(--ease);
}
.bar-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-3);border-radius:1px;opacity:.55}
.bar-val{font-size:13px;font-weight:700;flex:none;min-width:52px;text-align:right}
.bar-sub{font-size:10px;color:var(--ink-3);display:flex;align-items:center;gap:8px;padding-left:76px}
.bar-sub .sp{flex:1}
/* 模块条：照 GK —— 扁平行，名称 | 轨道 | 题量 | 正确率 四列全表对齐 */
.mrows{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:14px;padding:9px 4px;border-bottom:1px solid var(--line-2)}
.mrow:last-child{border-bottom:none}
.mname{width:118px;flex:none;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;min-width:0;white-space:nowrap}
.mname .pill{flex:none;font-size:9px;padding:2px 7px}
.mcount{width:64px;flex:none;text-align:right;font-size:11px;color:var(--ink-3)}
.mrate{width:74px;flex:none;text-align:right;font-size:13.5px;font-weight:700}
/* 子模块条行 */
.sub-row{display:flex;align-items:center;gap:10px}
.sub-name{font-size:11px;color:var(--ink-2);flex:none;width:76px}
.sub-meta{font-size:10px;color:var(--ink-3);flex:none;text-align:right;min-width:52px}

/* KPI 区：照 GK 行测页 —— 两张大环卡 + 右侧 2×2 小卡网格 */
.krow{display:grid;grid-template-columns:repeat(2,minmax(250px,320px)) minmax(0,1fr);gap:var(--gap)}
.kbig{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:16px 18px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.kbig:hover{box-shadow:var(--shadow-h);transform:translateY(-2px);border-color:var(--line-4)}
.kbig .kb-top{width:100%;display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink-3)}
.kbig .kb-ring{position:relative;display:flex;align-items:center;justify-content:center;margin:4px 0 2px}
.kbig .kb-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center}
.kbig .kb-val{font-size:24px;font-weight:700;line-height:1.05;letter-spacing:-.3px}
.kbig .kb-sub{font-size:10px;color:var(--ink-3)}
.kbig .kb-in{gap:4px}
.kbig .kb-foot{font-size:10px;color:var(--ink-4);text-align:center}
.kgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:var(--gap);min-width:0}
.kmini{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:14px 18px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0;
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur) var(--ease);
}
.kmini:hover{box-shadow:var(--shadow-h);transform:translateY(-2px);border-color:var(--line-4)}
.kmini .klab{font-size:10.5px;color:var(--ink-3)}
.kmini .kval{font-size:24px;font-weight:700;line-height:1.1}
.kmini .ksub{font-size:10px;color:var(--ink-3)}

/* 自定义日期选择器：原生日历弹层无法融入主题，自己做一套跟主题同 token 的 */
.dp{position:relative}
.dp .dp-face{cursor:pointer}
.dp-panel{
  position:absolute;top:calc(100% + 6px);left:0;z-index:170;width:262px;
  background:var(--surface);border:1px solid var(--line-3);border-radius:var(--r-lg);
  box-shadow:var(--shadow-h);padding:12px;animation:fadeIn .16s var(--ease);
}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.dp-title{font-size:12.5px;font-weight:600}
.dp-nav{display:flex;gap:2px}
.dp-nav button{width:24px;height:24px;border-radius:7px;color:var(--ink-3);display:grid;place-items:center;font-size:13px}
.dp-nav button:hover{background:var(--ghost);color:var(--ink)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-wd{font-size:9.5px;color:var(--ink-4);padding:3px 0}
.dp-day{height:27px;border-radius:8px;font-size:11.5px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background var(--dur)}
.dp-day:hover{background:var(--ghost)}
.dp-day.dim{color:var(--ink-5);opacity:.5}
.dp-day.sel{background:var(--rose);color:#fff;font-weight:700}
.dp-day.td{box-shadow:inset 0 0 0 1px var(--rose-line)}
.dp-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2)}
.dp-foot button{font-size:11px;color:var(--ink-3);padding:4px 8px;border-radius:7px}
.dp-foot button:hover{background:var(--ghost);color:var(--ink)}

/* 图表容器 */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.spark-path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--en-ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spark-area{opacity:0;animation:fadeIn .8s var(--ease) .45s forwards}
@keyframes fadeIn{to{opacity:1}}
.bar-g{
  transform-box:fill-box;transform-origin:bottom center;
  animation:grow .7s var(--en-ease) both;
}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pt{opacity:0;animation:pop .4s var(--en-ease) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.pt{transform-box:fill-box;transform-origin:center}
.legend{display:flex;align-items:center;gap:12px;font-size:10px;color:var(--ink-3);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* 数据点/网格（SVG 用色，跟随主题变量） */
.g-line{stroke:var(--line)}
.g-soft{stroke:var(--line-2)}
.t-ink{fill:var(--ink)} .t-ink2{fill:var(--ink-2)} .t-ink3{fill:var(--ink-3)} .t-ink4{fill:var(--ink-4)}

/* Toast */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line-3);border-radius:var(--r-lg);
  padding:10px 12px 10px 14px;box-shadow:0 10px 30px rgba(61,36,48,.16);
  font-size:12px;color:var(--ink-2);animation:toastIn .4s var(--en-ease) both;max-width:min(560px,90vw);
}
html[data-theme="dark"] .toast{box-shadow:0 12px 34px rgba(0,0,0,.55)}
.toast.out{animation:toastOut .28s var(--ease) both}
.toast .undo{color:var(--rose-soft);font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:var(--r-xs);background:var(--rose-dim)}
.toast .undo:hover{filter:brightness(1.06)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px) scale(.97)}}

/* 弹窗 */
.scrim{position:fixed;inset:0;z-index:150;background:var(--scrim);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow:auto;animation:fadeIn .22s var(--ease)}
.modal{
  width:min(680px,100%);background:var(--surface);border:1px solid var(--line-3);border-radius:var(--r-card);
  box-shadow:0 24px 70px rgba(61,36,48,.22);animation:modalIn .38s var(--en-ease) both;
}
html[data-theme="dark"] .modal{box-shadow:0 24px 70px rgba(0,0,0,.6)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.modal .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line-2)}
.modal .mbody{padding:16px 20px 18px}
.modal .mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line-2)}
/* 弹窗内表单：白底描边输入框 + 左对齐数字 —— 沿用侧栏的粉底/居中大字在弹窗里显糊 */
.modal .inp{background:var(--surface);border-color:var(--line-4)}
.modal .field:focus-within .inp{border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-dim)}
.modal .inp.num{height:40px;font-size:14px;font-weight:600;text-align:left;padding:0 12px;letter-spacing:.01em}
.modal textarea.inp{min-height:72px}
.modal .field > label{font-size:11px;font-weight:500;color:var(--ink-2);letter-spacing:.02em}
.mclose{width:28px;height:28px;border-radius:var(--r-sm);color:var(--ink-3);display:grid;place-items:center;transition:background var(--dur),color var(--dur)}
.mclose:hover{background:var(--ghost);color:var(--ink)}
.mclose svg{width:15px;height:15px}

/* 里程碑庆祝 */
.celebrate{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:300;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:cele 2.6s var(--en-ease) both;
}
.celebrate .cbadge{
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:var(--rose);color:#fff;font-size:26px;font-weight:800;font-family:var(--num);
  box-shadow:0 14px 40px var(--rose-line);animation:pulse 1.1s var(--en-ease) 2;
}
.celebrate .ctxt{font-size:13px;font-weight:600;color:var(--rose-soft);background:var(--surface);padding:6px 14px;border-radius:var(--r-pill);border:1px solid var(--line-3)}
@keyframes cele{0%{opacity:0;transform:translateX(-50%) scale(.6)}16%{opacity:1;transform:translateX(-50%) scale(1.04)}24%{transform:translateX(-50%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-24px) scale(.96)}}
@keyframes pulse{50%{transform:scale(1.14)}}

/* 新手引导：变暗遮罩留出高亮孔 + 说明卡 + 指向箭头 */
.guide-block{position:fixed;inset:0;z-index:250}
.guide-hl{
  position:fixed;z-index:251;pointer-events:none;border:2px solid var(--rose);border-radius:14px;
  box-shadow:0 0 0 5px rgba(255,107,157,.22),0 0 0 200vmax rgba(12,9,13,.55);
  transition:left .35s var(--ease),top .35s var(--ease),width .35s var(--ease),height .35s var(--ease);
}
.guide-arrow{
  position:fixed;z-index:252;width:13px;height:13px;background:var(--surface);
  border:1px solid var(--line-3);transform:rotate(45deg);
}
.guide-card{
  position:fixed;z-index:253;width:min(410px,calc(100vw - 32px));
  background:var(--surface);border:1px solid var(--line-3);border-radius:var(--r-lg);
  box-shadow:0 18px 50px rgba(12,9,13,.4);padding:18px 20px 16px;
  animation:modalIn .35s var(--en-ease) both;
}
.guide-card .gt{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:10px}
.guide-card .gt i{
  width:24px;height:24px;border-radius:8px;background:var(--rose);color:#fff;flex:none;
  display:grid;place-items:center;font-size:12.5px;font-style:normal;font-family:var(--num);font-weight:700;
}
.guide-card .gb{font-size:13.5px;color:var(--ink-2);line-height:1.85;margin-top:9px}
.guide-card .gb b{color:var(--rose-soft)}
.guide-card .gf{display:flex;align-items:center;gap:8px;margin-top:14px}
.guide-dots{display:flex;gap:5px;flex:1}
.guide-dots i{width:6px;height:6px;border-radius:3px;background:var(--line-4);transition:all var(--dur)}
.guide-dots i.on{background:var(--rose);width:16px}
.guide-card .btn.nk{border:none;background:none;padding:0 4px;font-size:12px;color:var(--ink-4)}
.guide-card .btn.nk:hover{background:none;color:var(--ink-2)}

/* 滚动进入视口 */
.reveal{opacity:0;transform:translateY(14px)}.reveal.in{opacity:1;transform:none;transition:opacity var(--en) var(--en-ease),transform var(--en) var(--en-ease)}
/* 侧栏与内容区的入场：只做一次，不随每次 render 重放 */
.enter > *{animation:enterUp var(--en) var(--en-ease) both}
@keyframes enterUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter > *:nth-child(1){animation-delay:.02s}
.enter > *:nth-child(2){animation-delay:.06s}
.enter > *:nth-child(3){animation-delay:.10s}
.enter > *:nth-child(4){animation-delay:.14s}
.enter > *:nth-child(5){animation-delay:.18s}
.enter > *:nth-child(6){animation-delay:.22s}
.enter > *:nth-child(n+7){animation-delay:.26s}

/* 提示条 */
.hint{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-lg);
  background:var(--surface-3);font-size:11px;color:var(--ink-2);
}
.hint svg{width:13px;height:13px;flex:none;color:var(--rose-soft)}
.hint.warn{background:var(--surface-3);color:var(--ink-2)}

/* 网格线（双轴图） */
.dual .axis-lab{font-size:9px;fill:var(--ink-4)}

@media (prefers-reduced-motion: reduce){
  .bg i{animation:none}
  .enter > *,.toast,.modal,.celebrate,.spark-path,.spark-area,.bar-g,.pt{animation:none !important}
  .reveal{opacity:1;transform:none}
  .spark-path{stroke-dashoffset:0}
  .spark-area,.pt{opacity:1}
  .ring .arc,.bar-fill,.tab-thumb,.seg-thumb{transition:none}
}
/* ============================================================
   quiet 模式：分段器 / 筛选这类小操作只重建数据，不重放整页动画。
   没有它，点任何一处分段器都会让卡片入场、条形生长、折线描边、
   热力格淡入全部重演一遍 —— 这就是"动一个、全都在动"的根源。
   ============================================================ */
body.quiet .enter > *{animation:none}
body.quiet .spark-path{animation:none;stroke-dashoffset:0}
body.quiet .spark-area,body.quiet .pt{animation:none;opacity:1}
body.quiet .bar-g{animation:none}
body.quiet .ring .arc{transition:none}
body.quiet .tab-thumb,body.quiet .seg-thumb{transition:none}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="nav">
  <div class="brand">
    <span class="mark"></span>
    <span class="bname">四级正确率监测</span>
    <span class="cdt num" id="cdt"></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="navact">
    <button class="ibtn icon" id="btn-theme" data-act="toggleTheme" title="切换深浅色"></button>
    <button class="ibtn" id="btn-settings" data-act="openSettings" title="设置">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.08a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>设置</span>
    </button>
    <button class="pbtn" id="btn-quick" data-act="quick">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5.5v13M5.5 12h13" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>记一笔
    </button>
  </div>
</header>

<main class="shell">
  <section class="main" id="main"></section>
  <aside class="side" id="side"></aside>
</main>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   1. 常量
   ============================================================ */
const LS_KEY='cet4_tracker_v1', LS_THEME='cet4_rate_theme_v1';

/* 模块表：parent=null 为一级模块。score 是 710 制权重（只用于提分贡献排序），
   与「每题原始分」raw 完全无关 —— 后者只用于卷面 100 制折算。 */
const MODULES=[
  {id:'listen',     name:'听力',    short:'听力', parent:null, color:'#FF6B9D', target:75, score:248.5, order:1},
  {id:'listen_news',name:'新闻听力',              parent:'listen', order:1},
  {id:'listen_conv',name:'长对话',                parent:'listen', order:2},
  {id:'listen_pass',name:'听力篇章',              parent:'listen', order:3},

  {id:'read',       name:'阅读',    short:'阅读', parent:null, color:'#FF9EC4', target:80, score:248.5, order:2},
  {id:'read_word',  name:'选词填空',              parent:'read',   order:1},
  {id:'read_match', name:'长篇匹配',              parent:'read',   order:2},
  {id:'read_care',  name:'仔细阅读',              parent:'read',   order:3},

  {id:'write',      name:'写作',    short:'写作', parent:null, color:'#FFB48F', target:70, score:106.5, mode:'subjective', order:3},
  {id:'write_arg',  name:'议论文',                parent:'write',  order:1},
  {id:'write_app',  name:'应用文',                parent:'write',  order:2},

  {id:'trans',      name:'翻译',    short:'翻译', parent:null, color:'#8FD4C8', target:70, score:106.5, mode:'subjective', order:4},
  {id:'trans_c2e',  name:'汉译英',                parent:'trans',  order:1},

  {id:'word',       name:'背单词',  short:'单词', parent:null, color:'#C77DFF', score:0, type:'vocab', order:5},
  {id:'word_new',   name:'新词',                  parent:'word',   order:1, kind:'new'},
  {id:'word_rev',   name:'复习',                  parent:'word',   order:2, kind:'review'},
];

/* 每题原始分：卷面满分 100 = 听力 35 + 阅读 35 + 写作 15 + 翻译 15。
   注意「听力篇章 / 仔细阅读每题 2 分」「选词填空每题 0.5 分」——
   正因每题分值不等，正确率不能直接乘 710 权重。 */
const RAW={
  listen_news:{qty:7, per:1,   group:'listen', full:7},
  listen_conv:{qty:8, per:1,   group:'listen', full:8},
  listen_pass:{qty:10,per:2,   group:'listen', full:20},
  read_word:  {qty:10,per:0.5, group:'read',   full:5},
  read_match: {qty:10,per:1,   group:'read',   full:10},
  read_care:  {qty:10,per:2,   group:'read',   full:20},
};
/* 常模参数组（官方不公布，取经验值） */
const NORMS={
  conservative:{mean:55, sd:15, name:'保守'},
  neutral:     {mean:52, sd:14, name:'中性'},
  optimistic:  {mean:50, sd:13, name:'乐观'},
};
const DEFAULT_SETTINGS={
  accuracyMode:'weighted', weekStart:'mon', minQuestions:5, includeVocab:false,
  examDate:'2026-12-19', passLine:425, normParams:'neutral', vocabBookSize:4500,
  reviewThreshold:85, theme:'light', milestones:[100,500,1000,2000],
  targets:{overall:70, objective:75, subjective:70, byModule:{listen:75, read:80, write:70, trans:70}},
  thresholds:{module:30, subtype:20},

  goals:{weeklyAccuracy:70, weeklyTotal:200},

const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const $=s=>document.querySelector(s);

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 全站百分比恒两位小数：手拼 +v+'%' 一律走这里 */
const pct=v=>(v==null?'—':(+v).toFixed(2)+'%');
const pct1=v=>(v==null?'—':(+v).toFixed(1)+'%');
const r1=v=>(v==null?'—':(+v).toFixed(1));
const r2=v=>(v==null?'—':(+v).toFixed(2));

const sum=a=>a.reduce((x,y)=>x+y,0);

function parseDay(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.round((parseDay(b)-parseDay(a))/864e5);}
function todayStr(){return ymd(new Date());}
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const dw=(x.getDay()+6)%7;x.setDate(x.getDate()-dw);return x;}
function fmtDate(s){const d=parseDay(s);return p2(d.getMonth()+1)+'-'+p2(d.getDate());}
const WD=['周日','周一','周二','周三','周四','周五','周六'];
function fmtDateCn(s){const d=parseDay(s);return s+' '+WD[d.getDay()];}

/* ============================================================
   3. 存储 / 演示数据
   ============================================================ */
function modById(id){return DB.modules.find(m=>m.id===id)||null;}
function childrenOf(id){return DB.modules.filter(m=>m.parent===id).sort((a,b)=>a.order-b.order);}
function roots(){return DB.modules.filter(m=>!m.parent).sort((a,b)=>a.order-b.order);}
/* 该模块 + 其全部子孙的 id（父模块统计走子树加权，不是子模块正确率平均） */
function subtree(id){
  const out=[id];
  for(const c of childrenOf(id)) out.push.apply(out,subtree(c.id));
  return out;
}
function isSub(id){const m=modById(id);return !!(m&&m.parent);}
/* 沿父链向上判断：word_new / word_rev 自身没有 type 字段，type 在父级 word 上 ——
   只查节点自身会把单词子模块判成非单词，"不计入整体正确率"就失效了 */
function isVocab(id){
  let m=modById(id);
  while(m){if(m.type==='vocab')return true;m=m.parent?modById(m.parent):null;}
  return false;
}
function isSubjective(id){const m=modById(id);return !!(m&&m.mode==='subjective')||subtree(id).some(x=>{const y=modById(x);return y&&y.mode==='subjective';});}
function modPath(id){
  const m=modById(id);if(!m)return '未知';
  if(!m.parent)return m.name;
  const p=modById(m.parent);return (p?p.name+' · ':'')+m.name;
}

/* 一条记录的折算：客观题 n=题目数 hit=正确数；主观题 n=满分 hit=实得 */
function recStat(r){return r.mode==='subjective'?{n:+r.fullScore||0,hit:+r.gotScore||0}:{n:+r.total||0,hit:+r.correct||0};}
function rateOf(hit,n){return n>0?hit/n*100:null;}

/* 记录子集 → 加权汇总；口径可切简单平均 */
function agg(recs){
  if(!recs.length)return {n:0,hit:0,rate:null,count:0};
  const mode=DB.settings.accuracyMode;
  let n=0,hit=0;
  for(const r of recs){const s=recStat(r);n+=s.n;hit+=s.hit;}
  if(mode==='average'){
    const rs=recs.map(r=>{const s=recStat(r);return s.n>0?s.hit/s.n*100:null;}).filter(v=>v!=null);
    return {n,hit,rate:rs.length?sum(rs)/rs.length:null,count:recs.length};
  }
  return {n,hit,rate:rateOf(hit,n),count:recs.length};
}

/* 时间范围过滤：days=0 表示全部 */
function inRange(rec,rng){
  if(!rng)return true;
  const t=todayStr(),back=dayDiff(rec.date,t);
  return back<=rng.days;
}
function rangeRecs(days,moduleId){
  const ids=moduleId?subtree(moduleId):null;
  /* 明确要看单词模块时当然要放行；只有"看全部"时才按 includeVocab 决定 */
  const allowVocab=moduleId?isVocab(moduleId):DB.settings.includeVocab;
  return DB.records.filter(r=>{
    if(ids&&ids.indexOf(r.module)<0)return false;
    if(!allowVocab&&isVocab(r.module))return false;
    return days?dayDiff(r.date,todayStr())<days:true;
  });
}
/* 只取"计入整体正确率"的记录（默认排除单词） */
function coreRecs(list){
  return list.filter(r=>!isVocab(r.module)||DB.settings.includeVocab);
}
/* 按模块聚合，模块值走子树加权 */
function modAgg(list,id){
  const ids=subtree(id);
  return agg(list.filter(r=>ids.indexOf(r.module)>=0));
}

/* 四档达标染色。返回真实色值 —— SVG 的 presentation attribute 不认 CSS 变量，
   所以全站统一吐 hex，HTML 的 style 与 SVG 的 fill/stroke 都能直接用。 */
function colorOf(v){
  if(v==null)return '#C2AFB9';
  const [a,b,c]=DB.settings.colorBands;
  if(v<a)return '#F2647C';
  if(v<b)return '#F5A623';
  if(v<c)return '#FF6B9D';
  return '#34C99A';
}
const colorHex=colorOf;

/* 周序列：最近 n 周，每周 [{start,end,recs,agg}] */
function weeksSeries(n,moduleId){
  const ids=moduleId?subtree(moduleId):null;
  const base=weekStart(new Date());
  const out=[];
  for(let i=n-1;i>=0;i--){
    const s=addDays(base,-7*i), e=addDays(s,6);
    const rs=DB.records.filter(r=>{
      if(ids&&ids.indexOf(r.module)<0)return false;
      if(!DB.settings.includeVocab&&isVocab(r.module)&&!moduleId)return false;
      const d=parseDay(r.date);return d>=s&&d<=e;
    });
    out.push({start:ymd(s),end:ymd(e),recs:rs,agg:agg(rs)});
  }
  return out;
}
/* 日序列：最近 n 天，每天 {date,recs,agg} */
function daysSeries(n,moduleId){
  const ids=moduleId?subtree(moduleId):null;
  const out=[];
  for(let i=n-1;i>=0;i--){
    const d=addDays(new Date(),-i), ds=ymd(d);
    const rs=DB.records.filter(r=>{
      if(r.date!==ds)return false;
      if(ids)return ids.indexOf(r.module)>=0;
      return DB.settings.includeVocab||!isVocab(r.module);
    });
    out.push({date:ds,recs:rs,agg:agg(rs)});
  }
  return out;
}
/* 最小二乘斜率（自变量取序号） */
function slope(vals){
  const v=vals.filter(x=>x!=null);
  if(v.length<2)return null;
  const n=v.length;let sx=0,sy=0,sxy=0,sxx=0;
  for(let i=0;i<n;i++){sx+=i;sy+=v[i];sxy+=i*v[i];sxx+=i*i;}
  const d=n*sxx-sx*sx;if(!d)return null;
  return (n*sxy-sx*sy)/d;
}
function stdev(vals){
  const v=vals.filter(x=>x!=null);
  if(v.length<2)return null;
  const m=sum(v)/v.length;
  return Math.sqrt(sum(v.map(x=>(x-m)*(x-m)))/(v.length-1));
}
/* 连续打卡：从今天（或昨天，避免刚过零点就断）向前数 */
function streakDays(){
  const set=new Set(DB.records.map(r=>r.date));
  let cur=new Date(),n=0;
  if(!set.has(ymd(cur)))cur=addDays(cur,-1);
  while(set.has(ymd(cur))){n++;cur=addDays(cur,-1);}
  return n;
}
function practiceDays(){return new Set(DB.records.map(r=>r.date)).size;}

/* ---------- 卷面原始分折算（预估分数的唯一依据） ---------- */
/* 出口 A：卷面比例等值  paper/100*710   （不含常模）
   出口 B：常模折算      (paper-Mean)/SD*70+500                */
function paperBreakdown(){
  const days=DB.settings.paperRange||0;
  const list=rangeRecs(days,null);
  const detail=[], groups={listen:{got:0,full:0,rows:[]}, read:{got:0,full:0,rows:[]}};
  for(const id in RAW){
    const spec=RAW[id];
    const rs=list.filter(r=>r.module===id);
    const a=agg(rs);
    const covered=a.rate!=null&&a.n>0;
    const got=covered?a.rate/100*spec.full:0;
    const row={id,name:modById(id).name,rate:a.rate,n:a.n,qty:spec.qty,per:spec.per,full:spec.full,
               got:covered?got:null,covered};
    groups[spec.group].rows.push(row);
    if(covered){groups[spec.group].got+=got;groups[spec.group].full+=spec.full;}
  }
  const norm=g=>g.full>0?g.got/g.full*35:null;
  const listen=norm(groups.listen), read=norm(groups.read);
  /* 主观题：15 分制评分档自评，取累计得分率 */
  const wAgg=agg(list.filter(r=>subtree('write').indexOf(r.module)>=0));
  const tAgg=agg(list.filter(r=>subtree('trans').indexOf(r.module)>=0));
  const write=wAgg.rate!=null?wAgg.rate/100*15:null;
  const trans=tAgg.rate!=null?tAgg.rate/100*15:null;
  const parts=[listen,read,write,trans].filter(v=>v!=null);
  const total=sum(parts);
  const covered=(listen!=null?1:0)+(read!=null?1:0)+(write!=null?1:0)+(trans!=null?1:0);
  return {groups,listen,read,write,trans,total,covered,ready:covered>0,
          ratio710:total/100*710};
}
function normScore(paper){
  const p=NORMS[DB.settings.normParams];
  return (paper-p.mean)/p.sd*70+500;
}
function normRange(paper){
  return {lo:normScore2(paper,'conservative'), hi:normScore2(paper,'optimistic')};
}
function normScore2(paper,key){
  const p=NORMS[key];return (paper-p.mean)/p.sd*70+500;
}

/* ---------- 弱项与提分 ---------- */
function weakSpots(list){
  const th=DB.settings.thresholds;
  const mods=roots().filter(m=>m.type!=='vocab').map(m=>({m,a:modAgg(list,m.id)}))
              .filter(x=>x.a.n>=th.module&&x.a.rate!=null).sort((a,b)=>a.a.rate-b.a.rate);
  /* 细分题型：同时排除自身和父级是单词的 —— 只查 m.id 会漏掉「新词/复习」这类挂在单词下的子题型 */
  const subs=DB.modules.filter(m=>m.parent&&m.type!=='vocab'&&modById(m.parent).type!=='vocab').map(m=>({m,a:modAgg(list,m.id)}))
              .filter(x=>x.a.n>=th.subtype&&x.a.rate!=null).sort((a,b)=>a.a.rate-b.a.rate);
  return {mod:mods[0]||null, sub:subs[0]||null, mods, subs};
}
/* 提分模拟：把最弱模块拉到它自己的目标线，重算整体正确率 */
function simulate(list){
  const w=weakSpots(list); if(!w.mod)return null;
  const target=targetOf(w.mod.m.id);
  const all=coreRecs(list); const base=agg(all);
  if(!base.n)return null;
  const others=sum(coreRecs(list).filter(r=>subtree(w.mod.m.id).indexOf(r.module)<0).map(r=>recStat(r).hit));
  const after=(others+w.mod.a.n*target/100)/base.n*100;
  return {mod:w.mod.m,sub:w.sub,base:base.rate,after,target,delta:after-base.rate};
}
/* 提分贡献：(目标率 − 当前率) × 模块分值（710 制权重） */
function contributions(list){
  return roots().filter(m=>m.type!=='vocab').map(m=>{
    const a=modAgg(list,m.id);
    const t=targetOf(m.id);
    const gap=a.rate==null?0:Math.max(0,t-a.rate);
    const paperGap=a.rate==null?0:(t-a.rate)/100*(m.id==='write'||m.id==='trans'?15:35);
    return {m,a,t,gap,gain:gap*m.score/100,paperGap,delta710:paperGap*70/14};
  }).sort((x,y)=>y.gain-x.gain);
}

/* ---------- 单词专区 ---------- */
function vocabBreak(){
  const news=DB.records.filter(r=>r.module==='word_new');
  const revs=DB.records.filter(r=>r.module==='word_rev');
  const na=agg(news), ra=agg(revs);
  const passed=sum(news.map(r=>recStat(r).n));
  const byBook={};
  revs.forEach(r=>{const k=r.book||'未标记单元';(byBook[k]=byBook[k]||[]).push(r);});
  const pool=[];
  for(const k in byBook){
    const rs=byBook[k].slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,2);
    const a=agg(rs);
    if(rs.length>=2&&a.rate!=null&&a.rate<DB.settings.reviewThreshold)
      pool.push({book:k,rate:a.rate,n:a.n,last:rs[0].date});
    else if(rs.length===1&&a.rate!=null&&a.rate<DB.settings.reviewThreshold-8)
      pool.push({book:k,rate:a.rate,n:a.n,last:rs[0].date,warn:true});
  }
  pool.sort((a,b)=>a.rate-b.rate);
  return {newAgg:na,revAgg:ra,passed,pool,news,revs};
}

/* ---------- 周报 ---------- */
function weeklyReport(moduleId){
  const ws=weeksSeries(2,moduleId);
  const cur=ws[1], prev=ws[0];
  if(!cur.recs.length)return '本周还没有记录。';
  const parts=[];
  const delta=cur.agg.rate!=null&&prev.agg.rate!=null?cur.agg.rate-prev.agg.rate:null;
  parts.push('本周整体 '+pct(cur.agg.rate)+(delta==null?'':(delta>=0?'（↑ '+r2(delta)+' pt）':'（↓ '+r2(Math.abs(delta))+' pt）'))+'。');
  const rows=roots().filter(m=>m.type!=='vocab').map(m=>{
    const a=modAgg(cur.recs,m.id), b=modAgg(prev.recs,m.id);
    return {m,a,b,d:a.rate!=null&&b.rate!=null?a.rate-b.rate:null};
  }).filter(x=>x.a.rate!=null);
  const moved=rows.filter(x=>x.d!=null&&Math.abs(x.d)>=1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,2);
  if(moved.length)parts.push(moved.map(x=>x.m.short+(x.d>0?' +':' ')+r1(x.d)+'%').join('，')+'。');
  else if(rows.length)parts.push(rows.map(x=>x.m.short+' 持平').join('，')+'。');
  /* 最弱模块用本周自己的数据找（不套用 30 题门槛 —— 一周样本本来就小），
     否则会出现"阅读 -1.4%"和"最弱是听力"并列的矛盾说法 */
  const weekMods=roots().filter(x=>x.type!=='vocab').map(x=>({m:x,a:modAgg(cur.recs,x.id)}))
    .filter(x=>x.a.rate!=null&&x.a.n>0).sort((x,y)=>x.a.rate-y.a.rate);
  if(weekMods.length){
    const w0=weekMods[0];
    const thin=w0.a.n<DB.settings.thresholds.module?'（样本偏少，仅供参考）':'';
    parts.push('本周最弱 '+w0.m.short+'（'+pct(w0.a.rate)+'，'+w0.a.n+' 题）'+thin+'。');
  }
  return parts.join('');
}

      createdAt:stamp-k*60000};
    if(sub){r.fullScore=total;r.gotScore=correct;}else{r.total=total;r.correct=correct;}
    if(book)r.book=book;
    k++;return r;
  }
  A.forEach(a=>out.push(mk(a[0],a[1],a[2],a[3],a[4],a[5],a[6],a[7])));
  NEWW.forEach((back,i)=>out.push(mk(back,'word_new',40,NEWC[i],'专项',25,'','四级核心 Unit '+(14-i))));
  return out;
}
function loadStore(){
  let raw=null;

  if(raw&&raw.records&&raw.records.length){

      records:raw.records,
      settings:Object.assign({},DEFAULT_SETTINGS,raw.settings||{}),
    };
    DB.settings.targets=Object.assign({},DEFAULT_SETTINGS.targets,(raw.settings&&raw.settings.targets)||{});
    DB.settings.targets.byModule=Object.assign({},DEFAULT_SETTINGS.targets.byModule,(raw.settings&&raw.settings.targets&&raw.settings.targets.byModule)||{});
    DB.settings.thresholds=Object.assign({},DEFAULT_SETTINGS.thresholds,(raw.settings&&raw.settings.thresholds)||{});
    DB.settings.goals=Object.assign({},DEFAULT_SETTINGS.goals,(raw.settings&&raw.settings.goals)||{});
    DB.settings._demo=false;
  }else{

function saveStore(){

function clearDemo(){

/* 清空数据时连里程碑标记一起复位，否则清完再加题永远不会再庆祝 */

function applyTheme(t){

/* ============================================================
   JS_CHART —— 全部手绘 SVG，零依赖
   ============================================================ */
const CX={pink:'#FF6B9D',pink2:'#FFA5C0',ok:'#34C99A',amber:'#F5A623',danger:'#F2647C',
          vocab:'#C77DFF',vocab2:'#E0BBFF'};

function ringSVG(val,size,color,tcolor,sw,goal){
  const W=sw||5;
  const r=size/2-W/2-2, c=2*Math.PI*r, p=val==null?0:clamp(val,0,100)/100;
  const m=size/2;
  /* 目标线刻度：从 12 点钟方向顺时针转 goal% 的一根径向短线，跨在环带上 */
  let tick='';
  if(goal!=null&&goal>0&&goal<100){
    tick='<line x1="'+m+'" y1="'+(m-r-W/2-4).toFixed(1)+'" x2="'+m+'" y2="'+(m-r+W/2+4).toFixed(1)+'"'
      +' stroke="var(--ink-2)" stroke-width="2.5" stroke-linecap="round"'
      +' transform="rotate('+(goal*3.6).toFixed(1)+' '+m+' '+m+')"/>';
  }
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    +'<circle cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" style="stroke:var(--track)" stroke-width="'+W+'"/>'
    +'<circle class="arc" cx="'+m+'" cy="'+m+'" r="'+r+'" fill="none" style="stroke:'+color+'" stroke-width="'+W+'"'
    +' stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(2)+' '+c.toFixed(2)+'"'
    +' transform="rotate(-90 '+m+' '+m+')"/>'
    +tick+'</svg>';
}

/* 取刻度序号：n 个点里均匀挑 max 个（含首末） */
function tickIdx(n,max){
  if(n<=max)return Array.from({length:n},(_,i)=>i);
  const out=[];
  for(let i=0;i<max;i++)out.push(Math.round(i*(n-1)/(max-1)));
  return Array.from(new Set(out));
}
/* 顶部取整到 5 的倍数，并保证目标线落在范围内 */
function niceRange(vals,goal){
  const all=vals.filter(v=>v!=null).concat(goal!=null?[goal]:[]);
  if(!all.length)return {lo:60,hi:100};
  let lo=Math.min.apply(null,all), hi=Math.max.apply(null,all);
  const pad=Math.max(2.5,(hi-lo)*0.28);
  lo=Math.floor((lo-pad)/5)*5; hi=Math.ceil((hi+pad)/5)*5;
  if(hi-lo<10){hi=lo+10;}
  return {lo:clamp(lo,0,100),hi:clamp(hi,0,100)};
}

/* ---------- 折线趋势图（周 / 日共用一套坐标系） ---------- */
function chartTrend(w,h){
  const mode=ST.range.trend, mod=ST.openMod;
  const goal=mod?targetOf(mod):DB.settings.targets.objective;
  let slots=[], holes=0, rangeDays=0;
  if(mode==='week'){
    /* 周档：0 题的周保留占位（x 轴间距不失真、标签照常），折线在缺口处断开。
       ⚠️ 不能把 null 直接塞进点列 —— Y(null) 会按数值 0 算，坐标落到图表区外，
       线会从卡片底部扎出去（2026-10-01 修的"折线超出画面"就是这个）。 */
    slots=weeksSeries(6,mod).map(x=>({label:fmtDate(x.start)+'周',value:x.agg.rate,n:x.agg.n}));
    holes=slots.filter(p=>p.value==null).length;
  }else{
    const n=ST.range.day; rangeDays=n;
    const ds=daysSeries(n,mod);
    holes=ds.filter(x=>x.agg.rate==null).length;
    slots=ds.filter(x=>x.agg.rate!=null).map(x=>({label:fmtDate(x.date),value:x.agg.rate,n:x.agg.n,date:x.date}));
  }
  const drawn=[];slots.forEach((p,i)=>{if(p.value!=null)drawn.push({p,i});});
  if(!drawn.length)
    return '<div class="empty">这个范围内还没有记录 —— 在右侧记一笔，曲线就会出现</div>';

  const padL=44,padR=18,padT=34,padB=40;
  const pw=Math.max(60,w-padL-padR), ph=Math.max(60,h-padT-padB);
  const {lo,hi}=niceRange(drawn.map(d=>d.p.value),goal);
  const X=i=>padL+(slots.length===1?pw/2:i*pw/(slots.length-1));
  const Y=v=>padT+(hi-v)/(hi-lo)*ph;

  let s='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" fill="none">';
  /* 网格 + Y 轴刻度 */
  const steps=4;
  for(let i=0;i<=steps;i++){
    const v=hi-(hi-lo)*i/steps, y=Y(v);
    s+='<line class="g-soft" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke-width="1"/>';
    s+='<text class="t-ink4" x="'+(padL-9)+'" y="'+(y+3.4).toFixed(1)+'" font-size="9" text-anchor="end" font-family="Inter">'+Math.round(v)+'%</text>';
  }
  /* 目标虚线：标签放右端、线的下方 —— 上方是值标签区（最高/末点都标在点上方），放上面必撞 */
  if(goal!=null&&goal>=lo&&goal<=hi){
    const gy=Y(goal);
    s+='<line x1="'+padL+'" y1="'+gy.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+gy.toFixed(1)+'" stroke="'+CX.pink2+'" stroke-width="1.6" stroke-dasharray="6 5"/>';
    s+='<text x="'+(w-padR)+'" y="'+(gy+14).toFixed(1)+'" font-size="9.5" fill="'+CX.pink2+'" text-anchor="end" font-family="Inter">目标 '+goal+'%</text>';
  }
  /* 面积 + 折线：按"连续有数据"的段画，缺口处断开；每段各自封底成面积 */
  const runs=[];let cur=[drawn[0]];
  for(let k=1;k<drawn.length;k++){
    if(drawn[k].i===cur[cur.length-1].i+1)cur.push(drawn[k]);
    else{runs.push(cur);cur=[drawn[k]];}
  }
  runs.push(cur);
  runs.forEach(run=>{
    const line=run.map(d=>X(d.i).toFixed(1)+','+Y(d.p.value).toFixed(1)).join(' ');
    if(run.length>1){
      const area=line+' '+X(run[run.length-1].i).toFixed(1)+','+(padT+ph)+' '+X(run[0].i).toFixed(1)+','+(padT+ph);
      s+='<polygon class="spark-area" points="'+area+'" fill="rgba(255,107,157,.10)"/>';
    }
    s+='<polyline class="spark-path" pathLength="1" points="'+line+'" stroke="'+CX.pink+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  /* 关键点：最高 / 最低 / 末点（只在有数据的点里找，null 不参与比较） */
  let iMax=0,iMin=0;
  drawn.forEach((d,k)=>{if(d.p.value>drawn[iMax].p.value)iMax=k;if(d.p.value<drawn[iMin].p.value)iMin=k;});
  const lastK=drawn.length-1;
  const keys={};
  keys[iMax]='max'; keys[iMin]='min'; keys[lastK]='last';
  if(lastK===iMax&&iMin!==lastK)delete keys[iMax];
  if(lastK===iMin&&iMax!==lastK)delete keys[iMin];
  drawn.forEach((d,k)=>{
    const x=X(d.i),y=Y(d.p.value),kk=keys[k];
    const col=kk==='max'?CX.ok:(kk==='min'?CX.danger:CX.pink);
    const rad=kk==='last'?5:3.4;
    s+='<circle class="pt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+rad+'" fill="'+(kk==='last'?'#E04B84':col)+'" style="animation-delay:'+(0.35+k*0.035).toFixed(2)+'s"/>';
    if(kk){
      const txt=pct1(d.p.value), tw=txt.length*6.4+8;
      /* 值标签必须垫一块与卡底同色的底，让折线在标签处断开 —— 否则压线看不清 */
      let tx=clamp(x-tw/2,padL-2,w-padR-tw+2), ty=y-26;
      if(ty<padT-6)ty=y+16;
      s+='<rect x="'+tx.toFixed(1)+'" y="'+(ty-11).toFixed(1)+'" width="'+tw.toFixed(1)+'" height="16" rx="4" style="fill:var(--surface)"/>';
      s+='<text class="pt" x="'+(tx+tw/2).toFixed(1)+'" y="'+(ty+1).toFixed(1)+'" font-size="11" font-weight="600" fill="'+col+'" text-anchor="middle" font-family="Inter" style="animation-delay:'+(0.5+k*0.035).toFixed(2)+'s">'+txt+'</text>';
    }
  });
  /* X 轴标签：周档全部槽位都标（0 题的周也显示），日档按密度抽稀 */
  const labN=mode==='week'?slots.length:(slots.length<=8?slots.length:(ST.range.day>14?5:4));
  tickIdx(slots.length,labN).forEach(i=>{
    s+='<text class="t-ink4" x="'+X(i).toFixed(1)+'" y="'+(h-14)+'" font-size="9.5" text-anchor="middle" font-family="Inter">'+slots[i].label+'</text>';
    if(slots.length<=8&&slots[i].n!=null)
      s+='<text class="t-ink4" x="'+X(i).toFixed(1)+'" y="'+(h-3)+'" font-size="8.5" text-anchor="middle" font-family="Inter" opacity=".8">'+slots[i].n+' 题</text>';
  });
  s+='</svg>';
  /* 日档摘要 */
  if(mode==='day'){
    const vals=drawn.map(d=>d.p.value);
    const mean=sum(vals)/vals.length;
    const bMax=drawn[iMax].p,bMin=drawn[iMin].p;
    s+='<div class="hint" style="margin-top:10px;flex-direction:column;align-items:flex-start;gap:3px">'
      +'<div style="font-weight:600">近 '+rangeDays+' 天 · '+drawn.length+' 天有记录 · '+holes+' 天未练</div>'
      +'<div class="num">均值 '+pct(mean)+'　最好 '+pct(bMax.value)+'（'+bMax.date.slice(5)+'）　最差 '+pct(bMin.value)+'（'+bMin.date.slice(5)+'）</div>'
      +'</div>';
  }
  return s;
}
/* 模块目标线：模块自己的目标 → 没设则按性质回落到客观题/主观题目标。
   ⚠️ 不再用 targets.overall 兜底 —— 那是已删除的旧「整体目标」设置遗留的隐藏值，
   用户改不了它，曾经出现过"目标线画在 86% 但目标其实是 73%"的困惑。 */
function targetOf(id){
  const m=modById(id);
  if(!m)return DB.settings.targets.objective;
  if(DB.settings.targets.byModule[id]!=null)return DB.settings.targets.byModule[id];
  return isSubjective(id)?DB.settings.targets.subjective:DB.settings.targets.objective;
}

/* ---------- 正确率 × 题量 双轴图 ---------- */
function chartDual(w,h){
  const ws=weeksSeries(8,ST.openMod);
  const has=ws.some(x=>x.agg.n>0);
  if(!has)return '<div class="empty">还没有足够的周数据</div>';
  const padL=44,padR=44,padT=26,padB=36;
  const pw=Math.max(60,w-padL-padR), ph=Math.max(50,h-padT-padB);
  const rVals=ws.map(x=>x.agg.rate).filter(v=>v!=null);
  const nVals=ws.map(x=>x.agg.n);
  const {lo,hi}=niceRange(rVals,null);
  const nMax=Math.max(20,Math.ceil(Math.max.apply(null,nVals)/50)*50);
  const bw=Math.min(30,pw/ws.length*0.52);
  const X=i=>padL+(i+0.5)*pw/ws.length;
  const Y=v=>padT+(hi-v)/(hi-lo)*ph;
  const NY=v=>padT+ph-(v/nMax)*ph;
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" fill="none">';
  for(let i=0;i<=4;i++){
    const v=hi-(hi-lo)*i/4,y=Y(v);
    s+='<line class="g-soft" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke-width="1"/>';
    s+='<text class="t-ink4" x="'+(padL-8)+'" y="'+(y+3.4).toFixed(1)+'" font-size="9" text-anchor="end" font-family="Inter">'+Math.round(v)+'%</text>';
    s+='<text class="t-ink4" x="'+(w-padR+8)+'" y="'+(y+3.4).toFixed(1)+'" font-size="9" font-family="Inter">'+Math.round(nMax*(1-i/4))+'</text>';
  }
  ws.forEach((x,i)=>{
    if(x.agg.n>0){
      const y=NY(x.agg.n);
      s+='<rect class="bar-g" x="'+(X(i)-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(padT+ph-y).toFixed(1)+'" rx="4" fill="'+CX.pink+'" opacity=".24" style="animation-delay:'+(i*0.045).toFixed(2)+'s"/>';
    }
    s+='<text class="t-ink4" x="'+X(i).toFixed(1)+'" y="'+(h-14)+'" font-size="9" text-anchor="middle" font-family="Inter">'+fmtDate(x.start)+'周</text>';
  });
  const lp=[];
  ws.forEach((x,i)=>{if(x.agg.rate!=null)lp.push({i,v:x.agg.rate});});
  if(lp.length>1){
    s+='<polyline class="spark-path" pathLength="1" points="'+lp.map(p=>X(p.i).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'" stroke="'+CX.pink+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  lp.forEach((p,k)=>{
    s+='<circle class="pt" cx="'+X(p.i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(k===lp.length-1?4.5:3)+'" fill="'+(k===lp.length-1?'#E04B84':CX.pink)+'" style="animation-delay:'+(0.35+k*0.05).toFixed(2)+'s"/>';
  });
  s+='</svg>';
  s+='<div class="legend" style="margin-top:8px"><span><i style="background:'+CX.pink+';opacity:.24"></i>当周题量（右轴）</span><span><i style="background:'+CX.pink+'"></i>当周正确率（左轴）</span></div>';
  return s;
}

/* ---------- 单词：每日过词量（新词 / 复习 叠柱） ---------- */
function chartDailyWords(w,h){
  const n=14, out=[];
  for(let i=n-1;i>=0;i--){
    const ds=ymd(addDays(new Date(),-i));
    const nw=DB.records.filter(r=>r.date===ds&&r.module==='word_new');
    const rv=DB.records.filter(r=>r.date===ds&&r.module==='word_rev');
    out.push({date:ds,newN:sum(nw.map(r=>recStat(r).n)),revN:sum(rv.map(r=>recStat(r).n))});
  }
  if(!out.some(x=>x.newN+x.revN>0))return '<div class="empty">这 14 天还没有背单词记录</div>';
  const padL=34,padR=12,padT=20,padB=32;
  const pw=Math.max(60,w-padL-padR), ph=Math.max(40,h-padT-padB);
  const hi=Math.max(40,Math.ceil(Math.max.apply(null,out.map(x=>x.newN+x.revN))/40)*40);
  const slot=pw/out.length, bw=Math.min(22,slot*0.56);
  let s='<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" fill="none">';
  /* Y 轴网格 + 刻度：只有顶端一个数没有量纲参照 */
  for(let i=0;i<=2;i++){
    const v=hi*(1-i/2),y=padT+(i/2)*ph;
    s+='<line class="g-soft" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke-width="1"/>';
    s+='<text class="t-ink4" x="'+(padL-8)+'" y="'+(y+3.4).toFixed(1)+'" font-size="9" text-anchor="end" font-family="Inter">'+Math.round(v)+'</text>';
  }
  s+='<line class="g-line" x1="'+padL+'" y1="'+(padT+ph)+'" x2="'+(w-padR)+'" y2="'+(padT+ph)+'" stroke-width="1"/>';
  out.forEach((d,i)=>{
    const cx=padL+(i+0.5)*slot;
    const tot=d.newN+d.revN;
    if(!tot){s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+(padT+ph-3)+'" width="'+bw.toFixed(1)+'" height="3" rx="1.5" style="fill:var(--line-3)"/>';return;}
    const totH=tot/hi*ph, newH=d.newN/hi*ph;
    s+='<rect class="bar-g" x="'+(cx-bw/2).toFixed(1)+'" y="'+(padT+ph-totH).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+totH.toFixed(1)+'" rx="3" fill="'+CX.pink2+'" opacity=".55" style="animation-delay:'+(i*0.03).toFixed(2)+'s"/>';
    if(d.newN)
      s+='<rect class="bar-g" x="'+(cx-bw/2).toFixed(1)+'" y="'+(padT+ph-totH).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+newH.toFixed(1)+'" rx="3" fill="'+CX.vocab+'" style="animation-delay:'+(0.1+i*0.03).toFixed(2)+'s"/>';
  });
  [0,Math.floor(out.length/2),out.length-1].forEach(i=>{
    s+='<text class="t-ink4" x="'+(padL+(i+0.5)*slot).toFixed(1)+'" y="'+(h-12)+'" font-size="9.5" text-anchor="middle" font-family="Inter">'+fmtDate(out[i].date)+'</text>';
  });
  s+='</svg>';
  s+='<div class="legend" style="margin-top:8px"><span><i style="background:'+CX.vocab+'"></i>当日新词</span><span><i style="background:'+CX.pink2+';opacity:.55"></i>当日合计（新词 + 复习）</span></div>';
  return s;
}

/* ============================================================
   图表绘制调度
   ============================================================ */
/* 条形旧状态抓拍：render() 重建 DOM 前记录每根带 data-key 条形的宽度/颜色，
   paintCharts 里用 WAAPI 从旧值显式补间到新值 —— 切档/下钻时条是"长过去/缩回来+变色"，
   且不依赖旧值先被渲染一帧（那在重建场景不可靠：旧值根本没进过样式计算）。 */
let BAR_OLD={};
function paintCharts(){
  $$('[data-chart]').forEach(el=>{
    const w=Math.max(220,Math.round(el.clientWidth||el.parentElement.clientWidth||620));
    const h=+el.dataset.h||240;
    const k=el.dataset.chart;
    try{
      if(k==='trend')el.innerHTML=chartTrend(w,h);
      else if(k==='dual')el.innerHTML=chartDual(w,h);
      else if(k==='dwords')el.innerHTML=chartDailyWords(w,h);
    }catch(err){el.innerHTML='<div class="empty">图表渲染失败：'+esc(err.message)+'</div>';}
  });
  /* 条形过渡：带 data-key 的条从抓拍的旧状态做 WAAPI 补间（宽度 + 颜色）；
     没有旧状态时维持原逻辑（quiet 直接落终值，首次从 0 长出来）。 */
  const quiet=document.body.classList.contains('quiet');
  const noMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const oldBars=BAR_OLD; BAR_OLD={};
  $$('.bar-fill').forEach(el=>{
    const tw=+el.dataset.w||0;
    const key=el.dataset.key||'';
    const old=key?oldBars[key]:null;
    if(old){
      const toBg=getComputedStyle(el).backgroundColor;
      /* 先无过渡落位再强制回流：否则"样式表 width:0 → 内联 tw"会触发一条从 0 起的
         CSS transition（数据没变时没有 WAAPI 盖住它，条就会从 0 重播一遍） */
      el.style.transition='none';
      el.style.width=tw+'%';
      if(!noMotion&&(Math.abs(old.w-tw)>0.05||old.bg!==toBg)){
        getComputedStyle(el).backgroundColor; /* 回流，钉住无过渡落位 */
        el.style.transition='';
        el.animate(
          [{width:old.w+'%',backgroundColor:old.bg},{width:tw+'%',backgroundColor:toBg}],
          {duration:850,easing:'cubic-bezier(.22,.61,.36,1)'});
      }else{
        void el.offsetWidth;
        el.style.transition='';
      }
    }else if(quiet){
      el.style.transition='none';el.style.width=tw+'%';void el.offsetWidth;el.style.transition='';
    }else{
      el.style.width='0%';void el.offsetWidth;
      requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=tw+'%';}));
    }
  });
  /* 页签滑块与分段器滑块 */
  layoutTabs(); sizeSegs();
}
let _ro=null,_rt=null;
function observeCharts(){
  if(!window.ResizeObserver)return;
  if(!_ro)_ro=new ResizeObserver(()=>{clearTimeout(_rt);_rt=setTimeout(paintCharts,120);});
  _ro.disconnect();
  $$('[data-chart]').forEach(el=>_ro.observe(el));
}

/* 分段器滑块：在长条上滑过去，而不是每块自己变色。
   布局期一律「无过渡落位」—— 重建 DOM 后从 0 滑过去就是"别的滑块原地动一下"的根源；
   动画只在点击时由事件层显式驱动（记旧位置 → 重建 → 从旧位置滑到新位置）。 */
function sizeSegs(){
  $$('.seg').forEach(seg=>{
    let th=seg.querySelector('.seg-thumb');
    const on=seg.querySelector('button.on');
    if(!on){if(th)th.hidden=true;return;}
    if(!th){th=document.createElement('i');th.className='seg-thumb';seg.insertBefore(th,seg.firstChild);}
    th.hidden=false;
    th.style.transition='none';
    th.style.transform='translateX('+on.offsetLeft+'px)';
    th.style.width=on.offsetWidth+'px';
    void th.offsetWidth;
    th.style.transition='';
  });
}
function layoutTabs(){
  const box=$('#tabs'); if(!box)return;
  let th=box.querySelector('.tab-thumb'); if(!th)return;
  const on=box.querySelector('.tab.on');
  if(!on){th.hidden=true;return;}
  th.hidden=false;
  th.style.transition='none';
  th.style.transform='translateX('+on.offsetLeft+'px)';
  th.style.width=on.offsetWidth+'px';
  void th.offsetWidth;
  th.style.transition='';
}
/* 点击后驱动一次真正的滑动：fromX/fromW 是重建前滑块的位置。
   过渡写在**内联样式**上 —— body.quiet 的样式表规则禁不掉内联，否则小操作下动画全部消失 */
function slideThumb(th,on,fromX,fromW){
  if(!th||!on)return;
  th.hidden=false;
  th.style.transition='none';
  th.style.transform=fromX;
  th.style.width=fromW;
  void th.offsetWidth;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    th.style.transition='none';
    th.style.transform='translateX('+on.offsetLeft+'px)';
    th.style.width=on.offsetWidth+'px';
    th.style.transition='';
    return;
  }
  th.style.transition='transform .3s cubic-bezier(.4,0,.2,1),width .3s cubic-bezier(.4,0,.2,1)';
  th.style.transform='translateX('+on.offsetLeft+'px)';
  th.style.width=on.offsetWidth+'px';
  clearTimeout(th.__st);
  th.__st=setTimeout(()=>{th.style.transition='';},340);
}

      +'</div>'
      +'<div style="display:flex;align-items:baseline;gap:8px;margin-top:8px">'
        +'<span class="num" style="font-size:22px;font-weight:700;color:'+col+'">'+pct1(x.a.rate)+'</span>'
        +'<span class="num" style="font-size:10px;color:var(--ink-3)">'+x.a.n+' 题 · 目标 '+targetOf(x.m.id)+'%</span></div>'
      +'</button>';

  /* 模块详情卡 */

  const trendCard='<div class="card grow" style="min-width:0">'
    +'<div class="chead"><div class="hl"><div><h3>趋势 · '+esc(open?open.name:'全部')+'</h3>'
    +'<div class="sub">'+(ST.range.trend==='week'?'近 6 周 · 折线为该周正确率 · 虚线为目标线':'空白日为未练，不画点')+'</div></div></div>'
    +'<div class="seg sm" data-seg="trendmode">'
      +'<button data-act="trendmode" data-v="week" class="'+(ST.range.trend==='week'?'on':'')+'">周</button>'
      +'<button data-act="trendmode" data-v="day" class="'+(ST.range.trend==='day'?'on':'')+'">日</button>'
    +'</div></div>'
    +(ST.range.trend==='day'
      ?'<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">'
        +'<span style="font-size:10px;color:var(--ink-3)">范围</span>'
        +'<div class="seg sm" data-seg="dayrange">'
          +[[7,'7 天'],[14,'14 天'],[30,'30 天']].map(o=>'<button data-act="dayrange" data-v="'+o[0]+'" class="'+(ST.range.day===o[0]?'on':'')+'">'+o[1]+'</button>').join('')
        +'</div>'
        +'<span style="font-size:10px;color:var(--ink-4);margin-left:auto">切换后折线与摘要同步重算</span></div>'
      :'')
    +'<div class="chart" data-chart="trend" data-h="270"></div>'
    +'</div>';

  const dualCard='<div class="card grow" style="min-width:0"><div class="chead"><div class="hl"><div><h3>正确率 × 题量 · 近 8 周</h3>'
    +'<div class="sub">练得多但没提升（柱高线平）与练得少但很准（柱低线高）一眼可分</div></div></div>'
    +'<span class="meta">柱为当周题量（右轴）· 折线为当周正确率（左轴）</span></div>'
    +'<div class="chart" data-chart="dual" data-h="230"></div></div>';
  /* 选中模块 → 详情(480) | 趋势 两列；未选中 → 左列放占位卡，保持两列结构不跳变
     （否则选中/取消时趋势卡在全宽与 480 列之间来回变形，整块布局都在动） */

    +'<span style="font-size:26px;opacity:.35">📊</span>'
    +'<div style="font-size:12.5px;font-weight:600;color:var(--ink-2)">点上方模块卡下钻</div>'

    +'</div>';
  const rowA = '<div class="cols lfix" style="--lc:480px"><div class="col">'+(detail||placeholder)+'</div><div class="col">'+trendCard+'</div></div>';
  return '<div class="main enter">'
    +'<div class="card" data-guide="ana-drill"><div class="chead" style="margin-bottom:12px"><div class="hl"><div><h3>模块下钻</h3>'
      +'<div class="sub">点模块卡看它的子模块正确率与趋势 · 再点一次取消（回到「全部」）</div></div></div>'
      +'<span class="pill">当前：'+esc(open?open.name:'全部')+'</span></div>'+cards+'</div>'
    +rowA
    +'<div class="row">'+dualCard+'</div>'
    +weeklyCard(open)
    +'</div>';

function detailCard(m){
  const list=coreRecs(DB.records);
  const a=modAgg(list,m.id);
  const kids=childrenOf(m.id);
  const t=targetOf(m.id);
  if(!kids.length){
    return '<div class="card" style="width:480px;flex:1;display:flex;flex-direction:column"><div class="chead"><div class="hl">'
      +'<span class="dot rd" style="background:'+m.color+'"></span><h3>'+esc(m.name)+'</h3></div></div>'
      +'<div class="empty">这个模块还没细分到题型 —— 录入时选上「题型」这里就会出现</div></div>';
  }
  let rows='';
  kids.forEach(k=>{
    const ka=modAgg(list,k.id);
    const col=colorHex(ka.rate);
    rows+='<div class="sub-row" style="flex-direction:column;align-items:stretch;gap:5px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
        +'<span style="font-size:11.5px;color:var(--ink-2)">'+esc(k.name)+'</span>'
        +'<span class="num" style="font-size:12px;font-weight:600;color:'+col+'">'+pct(ka.rate)+'</span></div>'
      +'<div style="display:flex;align-items:center;gap:8px">'
        +'<div class="bar-track thin" style="flex:1"><div class="bar-fill" data-key="sub-'+k.id+'" data-w="'+r1(ka.rate)+'" style="background:'+col+'"></div>'
        +'<div class="bar-goal" style="left:'+t+'%"></div></div>'
        +'<span class="num sub-meta">'+ka.n+' 题</span></div></div>';
  });
  /* 趋势速览 */
  const ws=weeksSeries(6,m.id);
  const vals=ws.map(x=>x.agg.rate);
  const sl=slope(vals), sd=stdev(vals);
  const wk=vals.filter(v=>v!=null);
  const proj=wk.length>=2&&sl!=null?wk[wk.length-1]+sl*(Math.max(0,Math.round(dayDiff(todayStr(),DB.settings.examDate)/7))):null;
  const weakest=kids.map(k=>({k,a:modAgg(list,k.id)})).filter(x=>x.a.rate!=null).sort((x,y)=>x.a.rate-y.a.rate)[0];
  return '<div class="card" style="width:480px;flex:1;display:flex;flex-direction:column">'
    +'<div class="chead" style="margin-bottom:12px"><div class="hl">'
      +'<span class="dot rd" style="background:'+m.color+'"></span><h3>'+esc(m.name)+'</h3>'
      +'<span class="pill rose">展开态 · '+kids.length+' 个题型</span></div>'
      +'<span class="meta">'+pct1(a.rate)+' · '+a.n+' 题 ｜ 目标 '+t+'%</span></div>'
    +'<div style="font-size:11px;font-weight:500;color:var(--ink-2);margin-bottom:8px">子模块正确率 · 卷面分值加权口径</div>'
    +'<div style="display:flex;flex-direction:column;gap:9px">'+rows+'</div>'
    +'<hr class="hr">'
    +'<div style="font-size:11px;font-weight:500;color:var(--ink-2);margin-bottom:8px">趋势速览 · '+esc(m.name)+'</div>'
    +'<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">'
      +miniCell('近 6 周斜率',sl==null?'—':(sl>=0?'+':'')+r2(sl)+' pt/周',sl==null?'样本不足':(sl>=0.3?'方向：上升':(sl<=-0.3?'方向：下滑':'方向：基本持平')),sl==null?null:(sl>=0?'var(--ok-fg)':'var(--danger)'))
      +miniCell('周正确率波动',sd==null?'—':'±'+r2(sd)+' pt',sd==null?'样本不足':(sd<3?'判定：稳定':(sd<6?'判定：一般':'判定：波动大')),'var(--amber)')
      +miniCell('外推至考试日',proj==null?'—':pct1(clamp(proj,0,100)),proj==null?'—':(proj>=t?'可达目标线':'仍低于目标'),'var(--rose-soft)')
    +'</div>'
    +(weakest?'<div class="hint" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5M12 16.5v.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/></svg>'
      +'<span style="flex:1">最该补：<b>'+esc(weakest.k.name)+'</b> '+pct(weakest.a.rate)+'，低于目标 '+r1(t-weakest.a.rate)+' pt（'+weakest.a.n+' 题样本）</span>'
      +'<span class="pill rose">优先练</span></div>':'')
    +'</div>';
}
function miniCell(label,val,sub,color){

    +'<div style="font-size:9.5px;color:var(--ink-3)">'+label+'</div>'

function weeklyCard(open){

  const range=ws[1]?(fmtDate(ws[1].start)+' 至 '+fmtDate(ws[1].end)):'—';
  const days=new Set(DB.records.filter(r=>r.date>=ws[1].start&&r.date<=ws[1].end).map(r=>r.date)).size;

        +(w.sub?'<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface-2);margin-top:12px">'

        +goalLine('周正确率',cur.rate,g.weeklyAccuracy,'var(--ok)')

function goalLine(name,val,target,color,isInt){
  const w=val==null?0:clamp(val/target*100,0,120);
  const ok=val!=null&&val>=target;
  return '<div style="display:flex;align-items:center;gap:10px">'
    +'<span style="font-size:11px;color:var(--ink-2);width:62px;flex:none">'+name+'</span>'
    +'<div class="bar-track thin" style="flex:1;height:9px"><div class="bar-fill" data-key="goal-'+name+'" data-w="'+r1(w)+'" style="background:'+(ok?'var(--ok)':color)+'"></div></div>'
    +'<span class="num" style="font-size:11px;font-weight:600;width:112px;text-align:right;flex:none;color:'+(ok?'var(--ok-fg)':'var(--ink-3)')+'">'
      +(val==null?'—':(isInt?Math.round(val):r1(val)))+' / '+target+'</span></div>';
}

function vVocab(){
  const v=vocabBreak();

  DB.records.filter(r=>r.module==='word_new'&&r.book).forEach(r=>{
    const k=r.book;(books[k]=books[k]||{n:0});books[k].n+=recStat(r).n;
  });
  const wCard=(o)=>'<div class="card hoverable" style="padding:16px">'
    +'<div style="font-size:11px;color:var(--ink-3)">'+o.label+'</div>'

    +wCard({label:'复习正确率',value:pct(rRate),color:rRate==null?'var(--ink-4)':colorHex(rRate),
      sub:'阈值 ≥ '+DB.settings.reviewThreshold+'% · '+(rRate==null?'暂无数据':(rOK?'达标':'偏低')),subColor:rOK?'var(--ok-fg)':'var(--amber)'})

  const pool='<div class="card"><div class="chead"><div class="hl"><h3>待复习池</h3></div>'
    +'<span class="meta">'+(v.pool.length?v.pool.length+' 个单元待重做':'全部达标')+'</span></div>'
    +'<div class="foot" style="margin-bottom:10px">按 book 分组，最近两轮复习正确率均低于阈值 '+DB.settings.reviewThreshold+'% 的单元进入这里，建议重做。</div>'
    +(v.pool.length?v.pool.map(p=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:10px;background:var(--surface-3);margin-bottom:8px">'
        +'<span style="font-size:11.5px;font-weight:500">'+esc(p.book)+'</span>'
        +'<span class="num" style="font-size:10.5px;color:var(--amber)">'+pct(p.rate)+' · '+p.n+' 词 · 建议重做</span></div>').join('')
      :'<div class="empty">没有需要重做的单元，保持这个节奏</div>')
    +'</div>';

  const rhythm=reviewRhythm();
  const rhythmCard='<div class="card"><div class="chead"><div class="hl"><h3>复习节奏</h3></div></div>'
    +'<div class="foot" style="margin-bottom:10px">次日 → 4 天 → 7 天 → 15 天 · 逾期未做会进「待复习池」</div>'
    +rhythm.map(r=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2);margin-bottom:8px">'
      +'<span style="font-size:11.5px;color:var(--ink-2)">'+r.label+'</span>'
      +'<span class="num" style="font-size:10.5px;color:'+(r.rows.length?'var(--rose-soft)':'var(--ink-4)')+'">'
        +(r.rows.length?sum(r.rows.map(x=>recStat(x).n))+' 词':'无记录')+'</span></div>').join('')
    +'</div>';

  const detail='<div class="card"><div class="chead"><div class="hl"><div><h3>词书进度明细</h3>'
    +'<div class="sub">四级核心 '+bookSize+' 词 · 已过 '+v.passed.toLocaleString()+' 词（'+pct(bookSize?v.passed/bookSize*100:null)+'）</div></div></div></div>'
    +(Object.keys(books).length?'<div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">'
      +Object.keys(books).map(k=>'<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:10px;background:var(--surface-2)">'

      :'<div class="empty">还没有按单元背词的记录</div>')

  const dailyCard='<div class="card"><div class="chead"><div class="hl"><div><h3>每日过词量 · 近 14 天</h3>'

    +'<div class="chart" data-chart="dwords" data-h="170"></div></div>';
  return '<div class="main enter">'
    +cards
    +'<div class="cols">'
      +'<div class="col">'+dailyCard+'</div>'
      +'<div class="col">'+pool+rhythmCard+'</div>'

    +detail

function todayList(){

  if(!rs.length)return '';
  return '<div class="card"><div class="chead" style="margin-bottom:10px">'
    +'<div class="hl"><h3 style="font-size:13px">今天已记</h3></div>'

    +rs.slice().sort((x,y)=>y.createdAt-x.createdAt).map(r=>{
      const s=recStat(r),rt=rateOf(s.hit,s.n);
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0">'
        +'<span style="font-size:11px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(modPath(r.module))+'</span>'
        +'<span class="num" style="font-size:10.5px;color:var(--ink-3);flex:none">'+s.hit+'/'+s.n+' · '+pct(rt)+'</span></div>';
    }).join('')
    +'</div>';

function calcPreview(){
  const d=ST.draft;
  if(ST.mode==='vocab'){
    const t=+d.total||0, c=+d.correct||0;
    const r=t?c/t*100:null;
    return {n:t,hit:c,rate:r,label:'本次正确率',target:DB.settings.reviewThreshold};
  }
  const t=+d.total||0;
  let c=+d.correct;
  const w=+d.wrong;
  if(d.wrong!==''&&!isNaN(w)&&t)c=t-w;
  if(isNaN(c))c=null;
  const r=(t&&c!=null&&c>=0)?c/t*100:null;
  return {n:t,hit:c,rate:r,label:'本次正确率',target:null};
}

function setBind(k,v){

function setBind2(k,v){
