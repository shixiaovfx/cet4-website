/* 智能推荐：正确率距目标缺口最大的模块（练习量达到弱项门槛的优先）；
   全部超线时推荐「离目标最近」的那个保持手感；没数据返回 null */
function recoModule(){
  const th=DB.settings.thresholds.module;
  const list=coreRecs(DB.records);
  const cands=roots().filter(m=>m.type!=='vocab').map(m=>({m,a:modAgg(list,m.id),t:targetOf(m.id)}))
    .filter(x=>x.a.n>0&&x.a.rate!=null);
  if(!cands.length)return null;
  const solid=cands.filter(x=>x.a.n>=th);
  const pool=solid.length?solid:cands;
  pool.sort((x,y)=>(y.t-y.a.rate)-(x.t-x.a.rate));
  return pool[0];
}
/* ============================================================
   保存
   ============================================================ */
function makeRec(mod,total,correct,extra){
  const m=modById(mod);
  const subj=m&&m.mode==='subjective';
  const r=Object.assign({id:'r_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
    date:ST.draft.date||todayStr(),module:mod,mode:subj?'subjective':'objective',
    tag:ST.draft.tag||null,duration:+ST.draft.dur||null,note:ST.draft.note||'',createdAt:Date.now()},extra||{});
  if(subj){r.fullScore=total;r.gotScore=correct;}else{r.total=total;r.correct=correct;}
  return r;
}
function pushRecords(recs,label){
  if(!recs.length)return;
  const before=sum(DB.records.map(r=>recStat(r).n));
  ST.undo={kind:'add',ids:recs.map(r=>r.id),at:Date.now()};
  DB.records=DB.records.concat(recs);
  saveStore();
  const after=sum(DB.records.map(r=>recStat(r).n));
  render();
  toast(label||('已记录 '+recs.length+' 条'),'撤销',()=>{
    DB.records=DB.records.filter(r=>recs.every(x=>x.id!==r.id));
    saveStore();render();toast('已撤销');
  });
  checkMilestone(before,after);
}
function saveCurrent(){
  const d=ST.draft, mode=ST.mode;
  if(mode==='vocab'){
    const total=+d.total, correct=+d.correct;
    if(!total||isNaN(correct))return toast('填一下词数和认识数');
    if(correct<0||correct>total)return toast('认识数要落在 0 ~ '+total+' 之间');
    pushRecords([makeRec(d.kind==='rev'?'word_rev':'word_new',total,correct,{book:d.book||null})]);
    ST.draft.total='';ST.draft.correct='';
    const bar=$('#calcbar');if(bar)bar.innerHTML='';
    return;
  }
  const mod=d.sub||d.mod;
  const subj=isSubjective(mod);
  const total=+d.total;
  let correct=+d.correct;
  if(!subj&&d.wrong!==''&&!isNaN(+d.wrong)){
    const w=+d.wrong;
    if(w>total)return toast('错题数（'+w+'）不能超过题目总数（'+total+'）');
    correct=total-w;
  }
  if(!total||isNaN(total))return toast('填一下'+(subj?'满分':'题目总数'));
  if(isNaN(correct)||correct<0||correct>total)return toast((subj?'实得':'正确数')+'要落在 0 ~ '+total+' 之间');
  pushRecords([makeRec(mod,total,correct)]);
  const keep={mod:d.mod,tag:d.tag,kind:d.kind,book:d.book};
  ST.draft.total='';ST.draft.wrong='';ST.draft.correct='';ST.draft.dur='';ST.draft.note='';
  ST.draft.sub='';ST.draft.mod=keep.mod;ST.draft.tag=keep.tag;ST.draft.book=keep.book;
}
function saveBatch(){
  const b=ST.batch;
  /* 先整卷校验：任何一行错题数/得分超过总数（含留空按默认题数），整批拦下并点名 */
  let bad=null;
  BATCH_ROWS.forEach(c=>{
    if(bad)return;
    const v=b[c[0]]||{a:'',b:''};
    if(v.b===''||v.b==null)return;
    const bb=+v.b;
    if(isNaN(bb))return;
    const a=(v.a===''||v.a==null)?c[3]:(+v.a);
    if(!a||isNaN(a)||a<=0)return;
    if(bb>a)bad={name:c[1],bb,a,subj:c[4]};
  });
  if(bad)return toast('「'+bad.name+'」的'+(bad.subj?'得分':'错题数')+'（'+bad.bb+'）不能超过'+(bad.subj?'满分':'总数')+'（'+bad.a+'），改一下再生成');
  const recs=[];
  BATCH_ROWS.forEach(c=>{
    const v=b[c[0]]||{a:'',b:''};
    const bb=+v.b;
    if(v.b===''||isNaN(bb))return;      /* 没填错题数/得分的行不录 */
    /* 总数（满分）留空但填了错题数 → 按该题型的默认题数计 */
    const a=(v.a===''||v.a==null)?c[3]:(+v.a);
    if(!a||isNaN(a)||a<=0)return;
    if(bb>a)return;
    recs.push({
      id:'r_'+Date.now()+'_'+c[0]+Math.random().toString(36).slice(2,4),
      date:b.date||todayStr(),module:c[0],mode:c[4]?'subjective':'objective',
      tag:'真题',duration:null,note:'一整套真题',createdAt:Date.now()+(recs.length),
      ...(c[4]?{fullScore:a,gotScore:bb}:{total:a,correct:a-bb}),
    });
  });
  if(!recs.length)return toast('至少填满一行的两组数字');
  pushRecords(recs,'已生成 '+recs.length+' 条记录（按细分题型）');
  BATCH_ROWS.forEach(c=>{ST.batch[c[0]]={a:'',b:''};});
  render();
}
function checkMilestone(before,after){
  const ms=DB.settings.milestones||[];
  const hit=ms.filter(m=>before<m&&after>=m&&!DB.settings['_hit'+m]);
  if(!hit.length)return;
  hit.forEach(m=>DB.settings['_hit'+m]=true);
  saveStore();
  const m=hit[hit.length-1];
  const el=document.createElement('div');
  el.className='celebrate';
  el.innerHTML='<div class="cbadge num">'+m+'</div><div class="ctxt">累计突破 '+m+' 题，继续保持</div>';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2700);
}

/* ============================================================
   Toast
   ============================================================ */
function toast(msg,actLabel,actFn){
  const box=$('#toasts');
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML='<span>'+esc(msg)+'</span>';
  if(actLabel){
    const b=document.createElement('button');
    b.className='undo';b.textContent=actLabel;
    b.onclick=()=>{actFn&&actFn();close();};
    el.appendChild(b);
  }
  box.appendChild(el);
  const close=()=>{el.classList.add('out');setTimeout(()=>el.remove(),300);};
  setTimeout(close,actLabel?6200:2600);
  return el;
}

   dispatch input/change 事件，完全复用现有的绑定逻辑。

function datePickerHTML(attrs,allowClear){
  return '<div class="dp" data-dp="1">'
    +'<input class="inp num dp-face" readonly autocomplete="off" data-act="dp-toggle" data-dpclear="'+(allowClear?1:0)+'" '+attrs+'>'
    +'<div class="dp-panel" hidden></div></div>';

function dpRender(panel){
  const dp=panel.parentElement,face=dp.querySelector('.dp-face');
  let y,mo;
  if(panel.dataset.ym){const p=panel.dataset.ym.split('-');y=+p[0];mo=+p[1];}
  else{const d=parseDay(face.value||todayStr());y=d.getFullYear();mo=d.getMonth();}
  panel.dataset.ym=y+'-'+mo;
  const first=new Date(y,mo,1);
  const gridStart=weekStart(first);
  const sel=face.value;
  const today=todayStr();
  const wd=['一','二','三','四','五','六','日'];
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i),ds=ymd(d);
    const dim=d.getMonth()!==mo;
    const cls='dp-day'+(dim?' dim':'')+(ds===sel?' sel':'')+((ds===today&&!dim)?' td':'');
    cells+='<button class="'+cls+'" data-act="dp-day" data-v="'+ds+'" type="button">'+d.getDate()+'</button>';
  }
  panel.innerHTML='<div class="dp-head">'
    +'<span class="dp-title num">'+y+' 年 '+(mo+1)+' 月</span>'
    +'<span class="dp-nav">'
      +'<button data-act="dp-prev" type="button">‹</button>'
      +'<button data-act="dp-next" type="button">›</button></span></div>'
    +'<div class="dp-grid">'+wd.map(w=>'<span class="dp-wd">'+w+'</span>').join('')+cells+'</div>'
    +'<div class="dp-foot">'
      +(face.dataset.dpclear==='1'?'<button data-act="dp-clear" type="button">清除</button>':'<span></span>')
      +'<button data-act="dp-today" type="button">今天</button></div>';
}
function dpClose(){ $$('.dp .dp-panel').forEach(p=>{p.hidden=true;}); }
function dpPick(face,ds){
  face.value=ds;

}

function download(name,text,type){
  const blob=new Blob([text],{type:type||'application/json;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function exportJSON(){
  download('cet4-tracker-'+todayStr()+'.json',
    JSON.stringify({modules:DB.modules,records:DB.records,settings:DB.settings},null,2));
  toast('已导出 JSON');
}
function exportCSV(){
  const head=['日期','模块','总数','正确数','满分','得分','标签','用时','备注'];
  const lines=[head.join(',')];
  DB.records.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{
    const s=recStat(r),sub=r.mode==='subjective';
    const row=[r.date,modById(r.module)?modById(r.module).name:r.module,
      sub?'':s.n,sub?'':s.hit,sub?s.n:'',sub?s.hit:'',
      r.tag||'',r.duration||'',(r.note||'').replace(/,/g,'，')];
    lines.push(row.join(','));
  });
  download('cet4-tracker-'+todayStr()+'.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');
  toast('已导出 CSV（'+DB.records.length+' 条）');
}
function pickFile(accept,cb){
  const inp=document.createElement('input');
  inp.type='file';inp.accept=accept;
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsText(f,'utf-8');};
  inp.click();
}
function importJSON(text){
  try{
    const o=JSON.parse(text);
    if(!o||!Array.isArray(o.records))throw new Error('缺少 records 字段');
    const snap=JSON.stringify(DB);
    DB.records=o.records;
    if(Array.isArray(o.modules)&&o.modules.length)DB.modules=o.modules;
    if(o.settings)DB.settings=Object.assign({},DB.settings,o.settings);
    DB.settings._demo=false;
    saveStore();render();
    toast('已导入 '+o.records.length+' 条记录','撤销',()=>{DB=JSON.parse(snap);saveStore();render();toast('已撤销导入');});
  }catch(e){toast('导入失败：'+e.message);}
}
function importCSV(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)return toast('CSV 内容为空');
  const head=lines[0].split(',').map(s=>s.trim());
  const idx={};
  head.forEach((h,i)=>idx[h]=i);
  const need=['日期','模块'];
  for(const n of need)if(idx[n]==null)return toast('CSV 缺少表头列：'+n);
  const nameMap={};
  DB.modules.forEach(m=>{nameMap[m.name]=m.id;nameMap[m.id]=m.id;});
  const recs=[];let bad=0;
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(',');
    const mod=nameMap[(c[idx['模块']]||'').trim()];
    const date=(c[idx['日期']]||'').trim();
    if(!mod||!date){bad++;continue;}
    const m=modById(mod), sub=m&&m.mode==='subjective';
    const g=k=>idx[k]==null?'':(c[idx[k]]||'').trim();
    const total=+g(sub?'满分':'总数')||0, hit=+g(sub?'得分':'正确数')||0;
    if(!total){bad++;continue;}
    const r={id:'r_'+Date.now()+'_i'+i,date,module:mod,mode:sub?'subjective':'objective',
      tag:g('标签')||null,duration:+g('用时')||null,note:g('备注')||'',createdAt:Date.now()+i};
    if(sub){r.fullScore=total;r.gotScore=hit;}else{r.total=total;r.correct=hit;}
    recs.push(r);
  }
  if(!recs.length)return toast('没有解析到有效记录（跳过了 '+bad+' 行）');
  const snap=JSON.stringify(DB);
  DB.records=DB.records.concat(recs);saveStore();render();
  toast('已导入 '+recs.length+' 条'+(bad?' · 跳过 '+bad+' 行':''),'撤销',()=>{DB=JSON.parse(snap);saveStore();render();toast('已撤销导入');});
}

const MOON='<svg viewBox="0 0 24 24" fill="none"><path d="M20 14.2A8.4 8.4 0 1 1 9.8 4a6.8 6.8 0 0 0 10.2 10.2z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>';
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  switchTheme(next);
}
function switchTheme(next){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const apply=()=>{
    applyTheme(next);
    const b=$('#btn-theme');if(b)b.innerHTML=(next==='dark'?SUN:MOON);
    render();
  };
  if(reduce||typeof document.startViewTransition!=='function'){apply();return;}
  try{
    document.documentElement.classList.add('vt-theme');
    const vt=document.startViewTransition(apply);
    vt.finished.finally(()=>document.documentElement.classList.remove('vt-theme'));
    /* 兜底：无合成层（无头浏览器 / 个别驱动）时 VT 不会触发 update 回调，
       只挂上 vt-theme 却什么也不发生。超时后自己补一刀，保证切换一定生效。 */
    setTimeout(()=>{
      if(document.documentElement.getAttribute('data-theme')!==next){
        apply();
        document.documentElement.classList.remove('vt-theme');
      }
    },420);
  }catch(e){
    document.documentElement.classList.remove('vt-theme');
    apply();
  }
}

/* ============================================================
   周报分享图（Canvas 手绘，800×1000）
   ============================================================ */
function rr(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function wrapText(g,text,x,y,maxW,lh){
  let line='',yy=y;
  for(const ch of String(text)){
    if(g.measureText(line+ch).width>maxW&&line){g.fillText(line,x,yy);line=ch;yy+=lh;}
    else line+=ch;
  }
  g.fillText(line,x,yy);
  return yy+lh;
}
function buildReportCanvas(){
  const W=800,H=1000,DPR=3;
  const cv=document.createElement('canvas');
  cv.width=W*DPR;cv.height=H*DPR;
  const g=cv.getContext('2d');
  g.scale(DPR,DPR);
  const F='"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif';
  const FN='Inter,system-ui,-apple-system,sans-serif';
  /* 深色版周报：跟 App 深色主题同一套观感（用户要求导出图也全部深色化） */
  const C={bg:'#131017',ink:'#F2E9EE',ink2:'#BBA9B6',ink3:'#8E7D89',
           rose:'#FF8AB7',deep:'#FF8AB7',ok:'#3BD9A4',track:'#2A222B',line:'#332C38',white:'#1D1A22'};
  const ws=weeksSeries(2,null);
  const cur=ws[1].agg, prev=ws[0].agg;
  const range=fmtDate(ws[1].start)+' 至 '+fmtDate(ws[1].end);
  const d=cur.rate!=null&&prev.rate!=null?cur.rate-prev.rate:null;
  const paper=paperBreakdown();
  const est=paper.ready?Math.round(normScore(paper.total)):null;
  const days=new Set(DB.records.filter(r=>r.date>=ws[1].start&&r.date<=ws[1].end).map(r=>r.date)).size;
  const subj=agg(DB.records.filter(r=>isSubjective(r.module)&&!isVocab(r.module)));

  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  /* 顶部两团柔光，呼应页面的背景语言（静态，不用循环） */
  let grd=g.createRadialGradient(760,60,10,760,60,300);
  grd.addColorStop(0,'rgba(255,107,157,.18)');grd.addColorStop(1,'rgba(255,107,157,0)');
  g.fillStyle=grd;g.fillRect(400,0,400,400);
  grd=g.createRadialGradient(60,940,10,60,940,320);
  grd.addColorStop(0,'rgba(120,220,190,.13)');grd.addColorStop(1,'rgba(120,220,190,0)');
  g.fillStyle=grd;g.fillRect(0,620,420,380);

  /* 品牌行：标题 22 / 副标 14 */
  g.fillStyle=C.rose;rr(g,48,52,28,28,9);g.fill();
  g.fillStyle=C.ink;g.font='700 22px '+F;g.fillText('四级正确率监测',88,74);
  g.fillStyle=C.ink2;g.font='500 14px '+F;g.fillText('周报 · '+range,48,116);

  /* 主数字：标签 14 / 大数 76 / 环比 16 / 摘要 14 */
  g.fillStyle=C.ink2;g.font='500 14px '+F;g.fillText('本周整体正确率',48,170);
  g.fillStyle=C.ink;g.font='800 76px '+FN;g.fillText(pct(cur.rate),48,248);
  if(d!=null){
    g.fillStyle=d>=0?C.ok:C.deep;g.font='600 16px '+FN;
    g.fillText((d>=0?'↑ ':'↓ ')+Math.abs(d).toFixed(2)+' pt 环比上周',48,282);
  }
  g.fillStyle=C.ink2;g.font='400 14px '+F;
  g.fillText('本周 '+cur.n+' 题 · 打卡 '+days+' 天 · 主观题得分率 '+pct(subj.rate),48,310);

  /* 模块条：区块标题 18 / 名称 14 / 数值 16 / 备注 13 */
  let y=372;
  g.fillStyle=C.ink;g.font='700 18px '+F;g.fillText('各模块正确率',48,y);
  y+=26;
  roots().filter(m=>m.type!=='vocab').forEach(m=>{
    const a=modAgg(ws[1].recs,m.id), t=targetOf(m.id);
    const col=colorOf(a.rate);
    g.fillStyle=C.ink;g.font='600 14px '+F;g.fillText(m.name,48,y+14);
    g.fillStyle=C.track;rr(g,132,y,480,16,8);g.fill();
    const bw=Math.max(a.rate==null?0:clamp(a.rate,0,100)/100*480,0);
    if(bw>0){const w2=Math.max(bw,6);g.fillStyle=col;rr(g,132,y,w2,16,Math.min(8,w2/2));g.fill();}
    const gx=132+t/100*480;
    g.fillStyle=C.ink3;g.fillRect(gx-1,y-3,2,22);
    g.fillStyle=col;g.font='700 16px '+FN;g.textAlign='right';
    g.fillText(pct(a.rate),752,y+14);g.textAlign='left';
    g.fillStyle=C.ink3;g.font='400 13px '+F;
    g.fillText(a.n+' 题 · 目标 '+t+'%',48,y+34);
    y+=56;
  });

  /* 四格：卡值 24 / 卡标 13 */
  y+=10;
  const cells=[['本周题量',cur.n+' 题',C.ink],['打卡天数',days+' 天',C.ink],
               ['卷面原始分',r1(paper.total)+' / 100',C.deep],['预估报道分',est==null?'—':est+' 分',C.deep]];
  cells.forEach((c,i)=>{
    const x=48+i*178;
    g.fillStyle=C.white;rr(g,x,y,166,86,14);g.fill();
    g.strokeStyle=C.line;g.lineWidth=1.5;g.stroke();
    g.fillStyle=C.ink2;g.font='400 13px '+F;g.fillText(c[0],x+14,y+27);
    g.fillStyle=c[2];g.font='700 24px '+FN;g.fillText(c[1],x+14,y+61);
  });
  y+=112;

  /* 一句话总结：白卡 + 描边，从浅粉底上提出来 */
  g.fillStyle=C.white;rr(g,48,y,704,132,16);g.fill();
  g.strokeStyle=C.line;g.lineWidth=1.5;g.stroke();
  g.fillStyle=C.deep;g.font='700 15px '+F;g.fillText('本周总结',68,y+31);
  g.fillStyle=C.ink;g.font='400 15px '+F;
  wrapText(g,weeklyReport(null),68,y+62,664,26);

  /* 脚注 12 */
  g.fillStyle=C.ink3;g.font='400 12px '+F;
  g.fillText('卷面原始分按每题原始分折算；报道分走官方常模公式换算，为经验值估算',48,930);
  g.fillText('生成于 '+todayStr()+' · 数据仅存本机',48,952);
  return cv;
}

function render(animate){
  /* animate=false（分段器 / 筛选等小操作）→ body.quiet：数据更新但动画全部跳到最终态，
     避免"动一处、全页跟着演一遍"。只有切页签 / 主题这类大切换才重放入场。 */
  document.body.classList.toggle('quiet',!animate);
  const main=$('#main');
  /* 重建前抓拍带 data-key 条形的实时状态（宽度可能是过渡中途值，正好做补间起点） */
  BAR_OLD={};
  main.querySelectorAll('.bar-fill[data-key]').forEach(el=>{
    const cs=getComputedStyle(el);
    const track=el.parentElement.getBoundingClientRect().width||1;
    BAR_OLD[el.dataset.key]={w:Math.min(120,parseFloat(cs.width)/track*100),bg:cs.backgroundColor};
  });
  main.innerHTML=viewHTML();
  const inner=main.firstElementChild;
  if(inner){inner.classList.remove('enter');if(animate)requestAnimationFrame(()=>inner.classList.add('enter'));}
  $('#side').innerHTML=sidePanel();

        saveStore();
      }
      closeModal();render();settingsModal();
      toast('已删除「'+(m?m.name:'')+'」，其记录归入上级模块');
      break;
    }
  }
  if(slide){
    const seg=document.querySelector('.seg[data-seg="'+slide.key+'"]');
    if(seg){
      /* 弹窗里的分段器不再整窗重建（会闪）—— 就地把 .on 移到被点的按钮，再驱动一次真滑动 */
      if(seg.closest('#modal-root')&&seg.contains(t)){
        seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));
      }
      const th=seg.querySelector('.seg-thumb'), on=seg.querySelector('button.on');
      slideThumb(th,on,slide.from,slide.w);
    }
  }
});
function delRecord(id){
  const r=DB.records.find(x=>x.id===id);if(!r)return;
  const snap=JSON.parse(JSON.stringify(r));
  DB.records=DB.records.filter(x=>x.id!==id);
  saveStore();render();
  toast('已删除 '+modPath(r.module),'撤销',()=>{DB.records.push(snap);saveStore();render();toast('已恢复');});
}
document.addEventListener('input',e=>{
  const t=e.target;
  const b=t.getAttribute('data-bind');
  if(b){setBind(b,t.value);if(b==='date'){ST.batch.date=t.value;}return;}
  const b2=t.getAttribute('data-bind2');
  if(b2){setBind2(b2,t.value);return;}
  const st=t.getAttribute('data-set');
  if(st){setSetting(st,t.value);return;}
  const tg=t.getAttribute('data-target');
  if(tg){
    const n=+t.value;
    if(n>0){DB.settings.targets.byModule[tg]=n;saveStore();render();}   /* 不刷新的话总览目标线停在旧值 */
    return;
  }
  const rn=t.getAttribute('data-rename');
  if(rn){
    const m=modById(rn);
    if(m&&t.value.trim()){m.name=t.value.trim();saveStore();}
    return;
  }
  if(t.id==='wipe-word'){
    const btn=$('#wipe-btn');
    if(btn){const ok=t.value.trim()==='清空';btn.disabled=!ok;btn.style.opacity=ok?'1':'.5';}
    return;
  }
  if(t.id==='hq'){
    ST.filters.q=t.value;
    clearTimeout(window.__hq);
    window.__hq=setTimeout(()=>{const box=$('#hlist');if(box){box.innerHTML=hlistInner();}},260);
  }
});
document.addEventListener('change',e=>{
  const st=e.target.getAttribute&&e.target.getAttribute('data-set');
  if(st){setSetting(st,e.target.value);return;}
  const rn=e.target.getAttribute&&e.target.getAttribute('data-rename');
  if(rn){render();refreshSettingsModal();return;} /* 失焦后同步其它视图里的模块名 */
});
function setSetting(k,v){
  const s=DB.settings;
  if(k.indexOf('.')>0){
    const [a,b]=k.split('.');
    s[a][b]=+v||0;
  }else if(k==='examDate'){s.examDate=v;}
  else{s[k]=+v||0;}
  saveStore();
  if(k==='examDate')updCdt();
  if(k.indexOf('targets.')===0||k==='paperRange'||k==='minQuestions'||k==='thresholds.module'||k==='thresholds.subtype'||k==='reviewThreshold'||k==='vocabBookSize')render();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();return;}
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.altKey&&e.key.toLowerCase()==='n'){ST.mode='set';render(true);e.preventDefault();return;}
  if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.closest&&e.target.closest('#side')
     &&ST.mode!=='set'&&e.target.tagName!=='TEXTAREA'){saveCurrent();e.preventDefault();}
});
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(paintCharts,140);});

/* 历史搜索：只重绘列表，避免输入时丢焦点 */
function hlistInner(){
  const f=ST.filters;
  let list=DB.records.slice();
  if(f.mod)list=list.filter(r=>subtree(f.mod).indexOf(r.module)>=0);
  if(f.tag)list=list.filter(r=>(r.tag||'')===f.tag);
  if(f.days)list=list.filter(r=>dayDiff(r.date,todayStr())<f.days);
  if(f.q){const q=f.q.toLowerCase();list=list.filter(r=>(modPath(r.module)+' '+(r.note||'')).toLowerCase().indexOf(q)>=0);}
  list.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:b.createdAt-a.createdAt));
  if(!list.length)return '<div class="empty">没有符合条件的记录</div>';
  const groups={};list.forEach(r=>{(groups[r.date]=groups[r.date]||[]).push(r);});
  let html='<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>日期</th><th>模块路径</th><th>题量 / 得分</th><th class="r">正确率</th><th>用时</th><th class="r">操作</th></tr></thead><tbody>';
  Object.keys(groups).sort().reverse().forEach(d=>{
    const rs=groups[d],a=agg(rs);
    html+='<tr class="grp"><td colspan="6">'+fmtDateCn(d)+'<span style="float:right;font-weight:400;color:var(--ink-3)">当日 '+rs.length+' 条 · '+a.n+' 题 · '+pct(a.rate)+'</span></td></tr>';
    rs.forEach(r=>{
      const s=recStat(r),rt=rateOf(s.hit,s.n),sub=modById(r.module)&&modById(r.module).mode==='subjective';
      html+='<tr><td class="num" style="width:70px;color:var(--ink-3)">'+r.date.slice(5)+'</td>'
        +'<td><span style="font-size:12px;font-weight:500">'+esc(modPath(r.module))+'</span>'+(r.tag?' <span class="pill">'+esc(r.tag)+'</span>':'')+'</td>'
        +'<td class="num" style="width:150px">'+s.hit+' / '+s.n+(sub?' 分':' 题')+'</td>'
        +'<td class="num r" style="width:110px;font-weight:600;color:'+colorHex(rt)+'">'+pct(rt)+'</td>'
        +'<td class="num" style="width:80px;color:var(--ink-3)">'+(r.duration?r.duration+' 分':'—')+'</td>'
        +'<td class="r" style="width:110px"><span class="ops">'
        +'<button data-act="edit" data-v="'+r.id+'">编辑</button>'
        +'<button class="del" data-act="del" data-v="'+r.id+'">删除</button></span></td></tr>';
    });
  });
  return html+'</tbody></table></div>';
}

/* ============================================================
   新手引导：首次打开自动出现（localStorage 标记），设置里可重看
   ============================================================ */

const GUIDE_STEPS=[
  {t:'欢迎使用四级正确率监测',
   b:'所有数据只保存在本机浏览器，不上传任何地方。你现在看到的是<b>演示数据</b>——熟悉之后到「历史 → 数据与备份 → 清空全部数据」清掉重来即可。',
   sel:null},
  {t:'右侧：随时记一笔',
   b:'三种录法：「模块刷题」选题型记正确率；「一整套」按 8 个题型分行录，总数留空自动按默认题数；「背单词」记词数与认识数。日期可改，支持补记。',
   sel:'#side .card'},
  {t:'两张环卡：客观题 vs 主观题',
   b:'左环是听力 + 阅读的<b>客观题</b>正确率，右环是写作 + 翻译的<b>主观题</b>得分率。两边的目标线在「设置 → 目标与门槛」里分开调。',
   sel:'[data-guide="kpi-obj"]'},
  {t:'模块正确率对比',
   b:'切「近 7 / 30 / 90 天」档位对比变化；低于自己目标线的模块会挂上同色「弱项」标。想看每个题型的正确率，翻到后面第 6 步的「分析」页。',
   sel:'[data-guide="cmp"]'},
  {t:'预估总分怎么来的',
   b:'各题型按每题分值折成卷面 100 分，再经常模折算成 710 制。常模参数有保守 / 中性 / 乐观三档，在「设置 → 考试与估分」里切换。',
   sel:'[data-guide="est"]'},
  {view:'analyze',t:'分析页：下钻到每个题型',
   b:'点任一模块卡，下方展开它的<b>子题型正确率、周 / 日趋势与最弱题型</b>；右边是「正确率 × 题量」双轴图——练得多却没提升、练得少但很准，一眼可辨。',
   sel:'[data-guide="ana-drill"]'},
  {view:'vocab',t:'单词页：背单词的家',
   b:'四张指标卡：<b>新词首答率</b>（健康区间 60–75%）、复习正确率、累计过词量、待复习池；下方是每日过词量与复习节奏。数据全部来自「记一笔 → 背单词」。',
   sel:'[data-guide="vocab-kpi"]'},
  {view:'history',t:'历史页：记录与备份',
   b:'左侧按<b>模块 / 标签 / 关键字</b>筛选全部记录，每条可编辑、删除；右栏是数据与备份：导出 JSON / CSV、导入恢复，以及需要输入「清空」二字的危险操作。',
   sel:'#side .card'},
  {view:'overview',t:'就这些，开始吧',
   b:'右上角<b>齿轮</b>是全部设置：目标、估分参数、统计口径、主题。每天记一笔，看板会替你盯着正确率的走向。祝备考顺利！',
   sel:null},
];
let _guidePlace=null;
function startGuide(){
  ST.guide=0;
  if(!_guidePlace){
    _guidePlace=function(){guidePlace();};
    window.addEventListener('resize',_guidePlace);
    window.addEventListener('scroll',_guidePlace,true);
  }
  guideShow();
}
function endGuide(){
  ST.guide=-1;
  const g=$('#guide-root');if(g)g.innerHTML='';
  try{localStorage.setItem(GUIDE_SEEN,'1');}catch(e){}
}
function guideShow(){
  const s=GUIDE_STEPS[ST.guide];
  /* 该步指定页面且当前不在 → 先切过去再定位（图表重建给一拍时间） */
  if(s.view&&ST.view!==s.view){
    ST.view=s.view;ST.openMod=null;
    render(true);window.scrollTo(0,0);
    setTimeout(()=>guidePlace(),140);
  }
  let g=$('#guide-root');
  if(!g){g=document.createElement('div');g.id='guide-root';document.body.appendChild(g);}
  const i=ST.guide;
  g.innerHTML='<div class="guide-block"></div><div class="guide-hl"></div><div class="guide-arrow" hidden></div>'
    +'<div class="guide-card"><div class="gt"><i>'+(i+1)+'</i>'+s.t+'</div>'
      +'<div class="gb">'+s.b+'</div>'
      +'<div class="gf"><div class="guide-dots">'+GUIDE_STEPS.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div>'
        +(i>0?'<button class="btn sm" data-act="guide-prev">上一步</button>':'')
        +'<button class="btn sm p" data-act="'+(i<GUIDE_STEPS.length-1?'guide-next':'guide-end')+'">'+(i<GUIDE_STEPS.length-1?'下一步':'开始使用')+'</button>'
        +'<button class="btn nk" data-act="guide-end">跳过</button>'
      +'</div></div>';
  requestAnimationFrame(guidePlace);
}
function guidePlace(){
  const i=ST.guide;
  const hl=document.querySelector('#guide-root .guide-hl'),
        card=document.querySelector('#guide-root .guide-card'),
        arrow=document.querySelector('#guide-root .guide-arrow');
  if(i==null||i<0||!hl||!card)return;
  const s=GUIDE_STEPS[i];
  const vw=window.innerWidth,vh=window.innerHeight;
  const t=s.sel?document.querySelector(s.sel):null;
  if(t&&t.offsetWidth>0){
    let r=t.getBoundingClientRect();
    if(r.top<60||r.bottom>vh-16||r.left<0||r.right>vw){
      t.scrollIntoView({block:'center'});
      r=t.getBoundingClientRect();
    }
    hl.style.display='';
    hl.style.left=(r.left-6)+'px';hl.style.top=(r.top-6)+'px';
    hl.style.width=(r.width+12)+'px';hl.style.height=(r.height+12)+'px';
    const cw=card.offsetWidth,ch=card.offsetHeight;
    let cx=clamp(r.left+r.width/2-cw/2,12,vw-cw-12),cy,dir;
    if(r.bottom+ch+30<vh){cy=r.bottom+16;dir='top';}
    else if(r.top-ch-30>56){cy=r.top-ch-16;dir='bottom';}
    else{
      cy=clamp(r.top+r.height/2-ch/2,64,vh-ch-14);
      cx=r.right+16;dir='left';
      if(cx+cw>vw-12){cx=r.left-cw-16;dir='right';}
    }
    card.style.left=cx+'px';card.style.top=cy+'px';
    /* 箭头：贴在卡片朝向目标的那条边，水平/垂直夹在目标中线与卡片范围内 */
    const tx=clamp(r.left+r.width/2,cx+22,cx+cw-22);
    const ty=clamp(r.top+r.height/2,cy+22,cy+ch-22);
    let ax,ay;
    if(dir==='top'){ax=tx-7;ay=cy-7;}
    else if(dir==='bottom'){ax=tx-7;ay=cy+ch-7;}
    else if(dir==='left'){ax=cx-7;ay=ty-7;}
    else{ax=cx+cw-7;ay=ty-7;}
    arrow.hidden=false;
    arrow.style.left=ax+'px';arrow.style.top=ay+'px';
  }else{
    hl.style.display='none';arrow.hidden=true;
    card.style.left=Math.max(12,(vw-card.offsetWidth)/2)+'px';
    card.style.top=Math.max(72,(vh-card.offsetHeight)/2.6)+'px';
  }
}

/* ============================================================
   启动
   ============================================================ */
function boot(){
  loadStore();
  let savedTheme=null;
  try{savedTheme=localStorage.getItem(LS_THEME);}catch(e){}
  let th=savedTheme||DB.settings.theme||'light';
  if(th==='system')th='light';   /* 跟随系统已移除，老值归浅色 */
  applyTheme(th);                /* applyTheme 会写回 LS_THEME，下次打开记住这次的颜色 */
  resetDraft(false);resetBatch();
  $('#btn-theme').innerHTML=(document.documentElement.getAttribute('data-theme')==='dark'?SUN:MOON);
  render(true);
  updCdt();
  setTimeout(()=>{layoutTabs();sizeSegs();},80);
  document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{layoutTabs();sizeSegs();});
  window.__ready=true;
  /* 首次打开：稍等首屏渲染完，弹新手引导 */
  setTimeout(()=>{
    let seen=null;try{seen=localStorage.getItem(GUIDE_SEEN);}catch(e){}
    if(!seen)startGuide();
  },700);
}
boot();
